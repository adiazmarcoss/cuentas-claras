<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuentas Claras</title>
<meta name="description" content="Tus compras producto a producto, ingresos, pagos fijos, presupuestos y ahorro.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1116" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna en el móvil con barra inferior fija; en escritorio, barra lateral y columna de lectura de 880px.
   Lo llamativo es una sola cosa: la tarjeta de saldo en tinta azul. Los tickets se ven como papel térmico. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F4F6F9; --paper:#FFFEF9; --line:#D9DFE7; --line-2:#C3CBD6;
  --fg:#131821; --muted:#586272; --faint:#8790A0;
  --accent:#2341C0; --accent-ink:#1A2F8C; --accent-fg:#FFFFFF; --accent-soft:#E1E6FA;
  --good:#16774A; --good-soft:#DBF0E3; --warn:#975800; --warn-soft:#FAEACC; --bad:#BC2E27; --bad-soft:#F9DFDC;
  --shadow:0 1px 2px rgba(19,24,33,.06),0 10px 28px rgba(19,24,33,.07);
  --scrim:rgba(14,18,24,.42);
  --c0:#3A6BD6; --c1:#DB6227; --c2:#2C9757; --c3:#A443BF; --c4:#C99817; --c5:#1598AE; --c6:#D13169; --c7:#6A788E; --c8:#8A673A; --c9:#5956D3;
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px; --nav-h:68px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1116; --surface:#151A21; --surface-2:#1B2129; --paper:#1D232C; --line:#29313C; --line-2:#3A4452;
    --fg:#E6EAF0; --muted:#9AA4B1; --faint:#6E7887;
    --accent:#7F95FF; --accent-ink:#1F2E73; --accent-fg:#0D1116; --accent-soft:#222B4C;
    --good:#4DC48B; --good-soft:#15301F; --warn:#E5A43C; --warn-soft:#382A11; --bad:#FF746B; --bad-soft:#3B1917;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --scrim:rgba(0,0,0,.6);
    --c0:#6F96F0; --c1:#F08955; --c2:#58C280; --c3:#C67CDC; --c4:#E4BD4C; --c5:#4AC2D4; --c6:#EE6B98; --c7:#9BA8BA; --c8:#BC976B; --c9:#8F8CF1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1116; --surface:#151A21; --surface-2:#1B2129; --paper:#1D232C; --line:#29313C; --line-2:#3A4452;
  --fg:#E6EAF0; --muted:#9AA4B1; --faint:#6E7887;
  --accent:#7F95FF; --accent-ink:#1F2E73; --accent-fg:#0D1116; --accent-soft:#222B4C;
  --good:#4DC48B; --good-soft:#15301F; --warn:#E5A43C; --warn-soft:#382A11; --bad:#FF746B; --bad-soft:#3B1917;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.6);
  --c0:#6F96F0; --c1:#F08955; --c2:#58C280; --c3:#C67CDC; --c4:#E4BD4C; --c5:#4AC2D4; --c6:#EE6B98; --c7:#9BA8BA; --c8:#BC976B; --c9:#8F8CF1;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.08rem;font-weight:700}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:.86rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* ---------- estructura ---------- */
.app{min-height:100%;display:block}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .brand{display:none}
.nav-btn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:.7rem;font-weight:600;border-radius:10px}
.nav-btn svg{width:22px;height:22px}
.nav-btn[aria-current="page"]{color:var(--accent)}
.nav-add{justify-self:center;width:54px;height:54px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:var(--shadow);margin-top:-22px}
.nav-add svg{width:26px;height:26px}
.nav-add span{display:none}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:880px;margin:0 auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.topbar h1{font-size:1.5rem;font-weight:800}
.topbar .app-name{font-family:var(--f-display);font-weight:700;font-size:.8rem;color:var(--accent);letter-spacing:.02em;display:block}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status[data-s="nube"] i{background:var(--good)}
.status[data-s="local"] i{background:var(--warn)}
.status[data-s="demo"] i{background:var(--accent)}
.view{display:flex;flex-direction:column;gap:22px}
.demo-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);color:var(--fg);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:14px;font-size:.9rem}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:236px 1fr}
  .nav{position:sticky;top:0;height:100vh;bottom:auto;right:auto;border-top:0;border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:22px 14px}
  .nav .brand{display:block;font-family:var(--f-display);font-weight:800;font-size:1.25rem;padding:4px 10px 18px;color:var(--fg)}
  .nav .brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.78rem;color:var(--muted)}
  .nav-btn{flex-direction:row;gap:12px;font-size:.95rem;padding:10px 12px;justify-content:flex-start}
  .nav-btn[aria-current="page"]{background:var(--accent-soft)}
  .nav-add{order:-1;width:100%;height:auto;margin:0 0 14px;border-radius:12px;padding:11px 14px;display:flex;gap:8px;justify-content:center;font-weight:700;box-shadow:none}
  .nav-add span{display:inline}
  .nav-add svg{width:20px;height:20px}
  main{padding-block:0 48px;width:100%}
  .topbar{padding-block:26px 14px}
  .topbar .app-name{display:none}
}

/* ---------- piezas ---------- */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:.88rem;padding:4px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel.flush{padding:4px 0}
.hero{background:var(--accent-ink);color:#F3F5FF;border-radius:18px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.hero .label{color:rgba(243,245,255,.72)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,9vw,2.9rem);line-height:1;letter-spacing:-.02em}
.hero .accts{display:flex;flex-wrap:wrap;gap:8px}
.hero .acct{background:rgba(255,255,255,.1);border-radius:999px;padding:5px 12px;font-size:.84rem}
.hero .acct b{font-weight:600}
.hero .sub{font-size:.84rem;color:rgba(243,245,255,.78)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:1.12rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.good{color:var(--good)} .stat .v.bad{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)} .pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 16px;background:none;border:0;border-top:1px solid var(--line);text-align:left;width:100%}
.list > .row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-family:var(--f-mono);font-weight:500;font-size:.92rem;text-align:right;white-space:nowrap}
.a.in{color:var(--good)}
.day-h{display:flex;justify-content:space-between;gap:10px;padding:14px 4px 6px;font-size:.8rem;font-weight:600;color:var(--muted)}
.day-h:first-letter{text-transform:uppercase}
.alert{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0;padding-top:2px}
.alert .bar{grid-column:1/-1}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:18px;border:1.5px dashed var(--line-2);border-radius:var(--r);background:var(--surface)}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.steps b{color:var(--fg);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);padding:9px 14px;font-weight:600;font-size:.92rem;line-height:1.2;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.small{padding:6px 10px;font-size:.82rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.month-sw{display:flex;align-items:center;gap:6px}
.month-sw b{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:9.5em;text-align:center}
.month-sw b::first-letter{text-transform:uppercase}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.search{flex:1 1 200px;min-width:0;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:600}
.chip .pr{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:.8rem;font-weight:600;color:var(--muted)}
.inp{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.big{font-family:var(--f-display);font-size:1.9rem;font-weight:700;padding:8px 12px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{font-size:.84rem;padding:9px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

/* ---------- hoja inferior ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:620px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:1.15rem}
.sheet-b{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-f .btn{flex:1 1 0}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px;max-height:88vh}.sheet-f{border-radius:0 0 20px 20px}.sheet-f .btn{flex:0 0 auto;min-width:120px}}

/* productos dentro del formulario */
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.item .inp{padding:8px 9px;font-size:.92rem}
.item .nm{grid-column:1/-1}
.item .tot{font-family:var(--f-mono);font-size:.9rem;text-align:right;min-width:4.5em}
.item .x{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--faint);display:grid;place-items:center}
.item .x:hover{color:var(--bad);background:var(--bad-soft)}
.item select.inp{grid-column:1/-1;font-size:.82rem;padding:6px 8px;color:var(--muted)}
.items-sum{display:flex;justify-content:space-between;font-weight:600;padding:2px 4px}
.reading{display:flex;align-items:center;gap:10px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* ticket en papel térmico */
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px 16px 22px;font-family:var(--f-mono);font-size:.86rem;line-height:1.55;position:relative;
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 50% 100%/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 50% 100%/14px 100% repeat-x}
.ticket .tc{text-align:center}
.ticket .store{font-weight:600;font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
.ticket hr{border:0;border-top:1.5px dashed var(--line-2);margin:10px 0}
.ticket .ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.ticket .ln .q{color:var(--muted);font-size:.8rem}
.ticket .tot{font-weight:600;font-size:1.05rem}

/* tablas */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-family:var(--f-mono);font-size:.86rem;white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}

/* gráficos */
.cat-rows{display:flex;flex-direction:column;gap:12px}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:baseline}
.cat-row .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.cat-row .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-row .vv{font-family:var(--f-mono);font-size:.86rem;white-space:nowrap}
.cat-row .track{grid-column:1/-1;height:10px;border-radius:99px;background:var(--surface-2);position:relative}
.cat-row .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.cat-row .track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);border-radius:2px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
.legend{display:flex;gap:16px;font-size:.82rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);border-radius:12px;padding:10px 14px;font-size:.9rem;font-weight:500;display:flex;gap:14px;align-items:center;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.toast button{background:none;border:0;color:var(--accent-soft);font-weight:700;padding:0}
@media (min-width:900px){.toast{bottom:28px}}
.goal{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.goal:first-child{border-top:0;padding-top:0}
.goal .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.plan-row{display:grid;grid-template-columns:minmax(0,1fr) 110px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.plan-row:first-child{border-top:0}
.plan-row .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.plan-row .nm small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.plan-row .inp{text-align:right;font-family:var(--f-mono);padding:8px 10px}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;outline:2px solid transparent}
.sw[aria-pressed="true"]{outline-color:var(--fg);outline-offset:2px}
.two-col{display:grid;gap:22px}
@media (min-width:900px){.two-col{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.skel{height:14px;border-radius:6px;background:var(--surface-2)}
.status{cursor:pointer}
.status[data-s="sync"] i{background:var(--accent);animation:pulse 1s ease-in-out infinite alternate}
.status[data-s="error"] i{background:var(--bad)}
@keyframes pulse{to{opacity:.3}}
@media (prefers-reduced-motion:reduce){.status[data-s="sync"] i{animation:none}}
.code{font-family:var(--f-mono);font-size:.78rem;word-break:break-all;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;user-select:all;-webkit-user-select:all}
textarea.inp{resize:vertical;min-height:72px;font-family:var(--f-mono);font-size:.82rem}
</style>
</head>
<body>

<div class="app">

<div class="sheet-wrap" id="sheet" hidden>

</div>
<div class="toast" id="toast" role="status" hidden></div>

<script>
"use strict";
/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const EUR = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
const r2 = n => Math.round((+n || 0) * 100) / 100;
const fmt = n => EUR.format(r2(n));
const fmtN = (n, d = 2) => new Intl.NumberFormat("es-ES", { minimumFractionDigits: 0, maximumFractionDigits: d }).format(+n || 0);
function parseNum(v) {
  if (typeof v === "number") return v;
  v = String(v ?? "").trim().replace(/[\s€]/g, "");
  if (!v) return NaN;
  if (v.includes(",")) v = v.replace(/\./g, "").replace(",", ".");
  return parseFloat(v);
}
const inpNum = n => (n === "" || n == null || isNaN(n)) ? "" : String(r2(n)).replace(".", ",");
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const curMk = () => todayStr().slice(0, 7);
function addMonths(mk, n) { let [y, m] = mk.split("-").map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; }
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const monthLabel = mk => { const [y, m] = mk.split("-"); return `${MESES[+m - 1]} ${y}`; };
const monthShort = mk => MESES[+mk.slice(5) - 1].slice(0, 3);
const daysIn = mk => { const [y, m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const dayLabel = s => new Date(s + "T12:00").toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
const dateShort = s => new Date(s + "T12:00").toLocaleDateString("es-ES", { day: "numeric", month: "short" });
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "") && !isNaN(new Date(s + "T12:00"));
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const norm = s => String(s || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ");
const clone = o => JSON.parse(JSON.stringify(o));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const plural = (n, a, b) => `${fmtN(n, 3)} ${n === 1 ? a : b}`;

/* =========================================================
   Configuración por defecto
   ========================================================= */
const DEFAULTS = {
  cats: [
    { id: "super", n: "Supermercado", c: 0, p: 0 },
    { id: "comer", n: "Comer fuera", c: 1, p: 0 },
    { id: "transp", n: "Transporte", c: 5, p: 0 },
    { id: "casa", n: "Casa y facturas", c: 8, p: 0 },
    { id: "subs", n: "Suscripciones", c: 9, p: 0 },
    { id: "ocio", n: "Ocio", c: 3, p: 0 },
    { id: "ropa", n: "Ropa", c: 6, p: 0 },
    { id: "salud", n: "Salud e higiene", c: 2, p: 0 },
    { id: "estudios", n: "Estudios", c: 4, p: 0 },
    { id: "otros", n: "Otros gastos", c: 7, p: 0 },
  ],
  catsIng: [
    { id: "trabajo", n: "Trabajo", c: 2 },
    { id: "beca", n: "Beca", c: 0 },
    { id: "familia", n: "Familia", c: 3 },
    { id: "ventas", n: "Ventas", c: 4 },
    { id: "otros-ing", n: "Otros ingresos", c: 7 },
  ],
  cuentas: [{ id: "banco", n: "Banco", ini: 0 }, { id: "efectivo", n: "Efectivo", ini: 0 }],
};
const METODOS = [{ id: "tarjeta", n: "Tarjeta", cuenta: "banco" }, { id: "efectivo", n: "Efectivo", cuenta: "efectivo" }, { id: "bizum", n: "Bizum", cuenta: "banco" }];
const FREQS = { mensual: "Cada mes", trimestral: "Cada 3 meses", anual: "Cada año" };

/* =========================================================
   Estado y almacenamiento
   ========================================================= */
const mkStore = () => ({ movs: [], fijos: [], metas: [], ajDoc: null, loaded: { movs: false, fijos: false, metas: false, aj: false } });
const Real = mkStore();
let Demo = null, demoOn = false;
const D = () => demoOn ? Demo : Real;
let backend = null;          // datos reales: en este dispositivo + sincronización con la hoja de Google
let mode = "loading";
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const K = { data: "cc-datos-v1", out: "cc-pendientes-v1", cfg: "cc-config-v1", sync: "cc-sync-v1" };
let Cfg = LS.get(K.cfg, {});          // { url, key, gemini, model }
const saveCfg = () => LS.set(K.cfg, Cfg);
const canTicket = () => !!Cfg.gemini;
const UI = { view: "inicio", mkMovs: curMk(), mkInf: curMk(), q: "", fTipo: "todo", qProd: "", budDraft: {}, iniDraft: {} };

function aj() {
  const d = D().ajDoc;
  if (!d) return DEFAULTS;
  return { cats: d.cats?.length ? d.cats : DEFAULTS.cats, catsIng: d.catsIng?.length ? d.catsIng : DEFAULTS.catsIng, cuentas: d.cuentas?.length ? d.cuentas : DEFAULTS.cuentas };
}
const allLoaded = () => demoOn || Object.values(Real.loaded).every(Boolean);
const sortMovs = arr => arr.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "") || (b.creado || 0) - (a.creado || 0));

/* ---------- Datos en este dispositivo ---------- */
let LD = LS.get(K.data, null) || { movs: {}, fijos: {}, metas: {}, ajustes: {} };
for (const c of ["movs", "fijos", "metas", "ajustes"]) LD[c] = LD[c] || {};
let OUT = LS.get(K.out, []);   // cambios pendientes de subir a la hoja
function persistLocal() {
  if (!LS.set(K.data, LD) || !LS.set(K.out, OUT)) toast("No queda espacio en este dispositivo para guardar. Sincroniza y exporta tus datos.");
}
function localBackend() {
  const toArr = col => Object.entries(LD[col]).map(([id, v]) => ({ id, ...clone(v) }));
  const refresh = () => {
    Real.movs = sortMovs(toArr("movs"));
    Real.fijos = toArr("fijos").sort((a, b) => (a.creado || 0) - (b.creado || 0));
    Real.metas = toArr("metas").sort((a, b) => (a.creado || 0) - (b.creado || 0));
    Real.ajDoc = LD.ajustes.general ? clone(LD.ajustes.general) : null;
    Real.loaded = { movs: true, fijos: true, metas: true, aj: true };
    scheduleRender();
  };
  const change = (col, id, data, del) => {
    const mod = Date.now();
    const rec = del ? null : { ...clone(data), mod };
    if (del) delete LD[col][id]; else LD[col][id] = rec;
    OUT = OUT.filter(o => !(o.col === col && o.id === id));
    OUT.push({ col, id, mod, del: !!del, data: rec });
    persistLocal(); refresh(); Sync.soon();
  };
  return {
    put: async (col, id, data) => change(col, id, data, false),
    del: async (col, id) => change(col, id, null, true),
    putAj: async data => change("ajustes", "general", data, false),
    subscribe: refresh, refresh,
  };
}

/* ---------- Sincronización con la hoja de Google ---------- */
const SYNC_ERR = {
  clave: "La clave no coincide con la del script de tu hoja.",
  respuesta: "Tu hoja no responde como se esperaba. Revisa que el script esté implementado como aplicación web con acceso para «Cualquier usuario».",
  red: "No se pudo conectar con tu hoja. Revisa tu conexión a internet y la dirección del script.",
  ocupado: "Tu hoja estaba ocupada. Se volverá a intentar enseguida.",
  servidor: "El script de tu hoja ha dado un error. Revisa que hayas copiado el código completo.",
};
async function callSheet(body, cfg = Cfg) {
  let r;
  try {
    r = await fetch(cfg.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...body, key: cfg.key }), redirect: "follow" });
  } catch (e) { throw { code: "red" }; }
  if (!r.ok) throw { code: r.status === 404 ? "respuesta" : "red" };
  let j; try { j = await r.json(); } catch (e) { throw { code: "respuesta" }; }
  if (!j || !j.ok) throw { code: (j && j.error) || "servidor" };
  return j;
}
const Sync = {
  state: "idle", err: "", timer: null, running: false,
  soon(ms = 1500) { clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  async run() {
    if (!Cfg.url || !Cfg.key || this.running || demoOn) { updateStatus(); return; }
    if (!navigator.onLine) { this.state = "offline"; updateStatus(); return; }
    this.running = true; this.state = "sync"; updateStatus();
    const sent = OUT.slice(0, 150);
    const meta = LS.get(K.sync, { since: 0 });
    try {
      const res = await callSheet({ action: "sync", since: meta.since || 0, changes: sent });
      OUT = OUT.filter(o => !sent.some(s => s.col === o.col && s.id === o.id && s.mod === o.mod));
      for (const r of res.changes || []) {
        if (!LD[r.col] || OUT.some(o => o.col === r.col && o.id === r.id)) continue;
        const loc = LD[r.col][r.id];
        if (loc && (loc.mod || 0) > (r.mod || 0)) continue;
        if (r.del) delete LD[r.col][r.id];
        else LD[r.col][r.id] = { ...(r.data || {}), mod: r.mod };
      }
      LS.set(K.sync, { since: res.now, last: Date.now() });
      persistLocal(); backend.refresh();
      this.state = "ok"; this.err = "";
      if (OUT.length) this.soon(400);
    } catch (e) {
      this.state = "error"; this.err = SYNC_ERR[e && e.code] || SYNC_ERR.red;
      if (e && e.code === "ocupado") this.soon(5000);
    }
    this.running = false; updateStatus(); scheduleRender();
  },
};
function lastSyncText() {
  const t = LS.get(K.sync, {}).last; if (!t) return "todavía no";
  const m = Math.round((Date.now() - t) / 60000);
  return m < 1 ? "hace un momento" : m < 60 ? `hace ${m} min` : new Date(t).toLocaleString("es-ES", { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
function updateStatus() {
  const el = $("#status"); if (!el) return;
  let s, t;
  if (demoOn) [s, t] = ["demo", "Ejemplo"];
  else if (!Cfg.url) [s, t] = ["local", "Sin sincronizar"];
  else if (Sync.state === "sync") [s, t] = ["sync", "Sincronizando"];
  else if (Sync.state === "error") [s, t] = ["error", "Error al sincronizar"];
  else if (!navigator.onLine || Sync.state === "offline") [s, t] = ["local", OUT.length ? `Sin conexión · ${OUT.length} pendientes` : "Sin conexión"];
  else if (OUT.length) [s, t] = ["sync", `${OUT.length} pendientes`];
  else [s, t] = ["nube", "Sincronizado"];
  el.dataset.s = s; el.lastElementChild.textContent = t;
}

function memBackend(store, persistKey) {
  // Guarda en memoria (ejemplo) o en este navegador (cuando no hay sincronización)
  let st = { movs: {}, fijos: {}, metas: {}, aj: null };
  if (persistKey) { try { const raw = localStorage.getItem(persistKey); if (raw) st = Object.assign(st, JSON.parse(raw)); } catch (e) {} }
  const persist = () => { if (!persistKey) return; try { localStorage.setItem(persistKey, JSON.stringify(st)); } catch (e) { toast("Este navegador no deja guardar datos. Lo que añadas se perderá al cerrar."); } };
  const sync = () => {
    store.movs = sortMovs(Object.entries(st.movs).map(([id, v]) => ({ id, ...clone(v) })));
    store.fijos = Object.entries(st.fijos).map(([id, v]) => ({ id, ...clone(v) })).sort((a, b) => (a.creado || 0) - (b.creado || 0));
    store.metas = Object.entries(st.metas).map(([id, v]) => ({ id, ...clone(v) })).sort((a, b) => (a.creado || 0) - (b.creado || 0));
    store.ajDoc = st.aj ? clone(st.aj) : null;
    store.loaded = { movs: true, fijos: true, metas: true, aj: true };
    scheduleRender();
  };
  return {
    st,
    put: async (col, id, data) => { st[col][id] = clone(data); persist(); sync(); },
    del: async (col, id) => { delete st[col][id]; persist(); sync(); },
    putAj: async data => { st.aj = clone(data); persist(); sync(); },
    subscribe: sync,
  };
}
let demoBackend = null;
const W = () => demoOn ? demoBackend : backend;

const ERRS = {
  quota_exceeded: "Se ha llenado el espacio de la app. Exporta tus datos y borra movimientos antiguos para seguir.",
  resource_exhausted: "Demasiados cambios seguidos. Espera unos segundos y vuelve a intentarlo.",
  invalid_argument: "No se pudo guardar este dato. Revisa los campos e inténtalo de nuevo.",
};
async function save(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) { toast(ERRS[e?.code] || "No se pudo guardar. Comprueba tu conexión e inténtalo de nuevo."); return false; }
}
const putMov = (id, data) => W().put("movs", id, data);
const putAj = patch => W().putAj({ ...clone(aj()), ...patch });

function setMode(m) { mode = m; updateStatus(); }

/* =========================================================
   Cálculos
   ========================================================= */
const catById = id => aj().cats.find(c => c.id === id) || aj().catsIng.find(c => c.id === id) || { id, n: "Sin categoría", c: 7, p: 0 };
const cuentaById = id => aj().cuentas.find(c => c.id === id) || { id, n: id || "Cuenta", ini: 0 };
const metodoN = id => (METODOS.find(m => m.id === id) || {}).n || "";
const cvar = c => `var(--c${(+c || 0) % 10})`;
const monthMovs = mk => D().movs.filter(m => (m.fecha || "").startsWith(mk));
function totals(mk) {
  let ing = 0, gas = 0;
  for (const m of monthMovs(mk)) { if (m.tipo === "ingreso") ing += +m.importe || 0; else if (m.tipo === "gasto") gas += +m.importe || 0; }
  return { ing: r2(ing), gas: r2(gas), bal: r2(ing - gas) };
}
const catSpend = mk => catSpendList(monthMovs(mk));
function catSpendList(list) {
  // Los productos con categoría propia cuentan en su categoría; el resto, en la de la compra
  const map = {};
  const add = (k, v) => { map[k] = (map[k] || 0) + v; };
  for (const m of list) {
    if (m.tipo !== "gasto") continue;
    let rest = +m.importe || 0;
    for (const it of m.items || []) { if (it.c && it.c !== m.cat) { add(it.c, +it.t || 0); rest -= +it.t || 0; } }
    add(m.cat, rest);
  }
  for (const k in map) map[k] = r2(map[k]);
  return map;
}
function saldos() {
  const s = {};
  for (const c of aj().cuentas) s[c.id] = +c.ini || 0;
  for (const m of D().movs) {
    const v = +m.importe || 0;
    if (m.tipo === "ingreso") s[m.cuenta] = (s[m.cuenta] || 0) + v;
    else if (m.tipo === "gasto") s[m.cuenta] = (s[m.cuenta] || 0) - v;
    else if (m.tipo === "traspaso") { s[m.cuenta] = (s[m.cuenta] || 0) - v; s[m.destino] = (s[m.destino] || 0) + v; }
  }
  for (const k in s) s[k] = r2(s[k]);
  return s;
}
function productStats(mk) {
  const map = new Map();
  for (const m of D().movs) {
    if (m.tipo !== "gasto" || !m.items?.length) continue;
    if (mk && !(m.fecha || "").startsWith(mk)) continue;
    for (const it of m.items) {
      const k = norm(it.n); if (!k || (+it.t || 0) < 0) continue;
      let p = map.get(k);
      if (!p) { p = { k, n: it.n, q: 0, t: 0, veces: 0, last: "", lastP: 0, lastStore: "", c: it.c || m.cat }; map.set(k, p); }
      p.q += +it.q || 0; p.t += +it.t || 0; p.veces++;

const Sheet = { onClick: null, onInput: null, onChange: null, lastFocus: null };

let toastTimer = null;

function movFormClick(e) {

/* ---------- Gemini (Google) para leer tickets ---------- */
const GEM = "https://generativelanguage.googleapis.com/v1beta";
async function gemFetch(path, opts = {}, key = Cfg.gemini) {
  try { return await fetch(GEM + path, { ...opts, headers: { "x-goog-api-key": key, ...(opts.headers || {}) } }); }
  catch (e) { if (e && e.name === "AbortError") throw { code: "cancelled" }; throw { code: "red" }; }
}
async function geminiModels(key = Cfg.gemini) {
  // Elige el modelo «Flash» más reciente que tu clave pueda usar
  const r = await gemFetch("/models?pageSize=200", {}, key);
  if (r.status === 400 || r.status === 401 || r.status === 403) throw { code: "key" };
  if (!r.ok) throw { code: "upstream" };
  const j = await r.json();
  const names = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => String(m.name).replace(/^models\//, ""));
  const ok = names.filter(n => /^gemini-/.test(n) && /flash/.test(n) && !/(image|tts|audio|live|embedding|exp|thinking|8b)/.test(n));
  const ver = n => { const m = n.match(/^gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
  const score = n => ver(n) * 10 - (/lite/.test(n) ? 3 : 0) - (/preview/.test(n) ? 1 : 0) - (/-\d{3,}$/.test(n) ? 0.5 : 0);
  const list = ok.sort((a, b) => score(b) - score(a));
  if (names.includes("gemini-flash-latest")) list.unshift("gemini-flash-latest");
  return [...new Set(list)].slice(0, 5);
}
async function toJpegBase64(file, maxSide = 2000) {
  let img;
  try { img = await createImageBitmap(file); }
  catch (e) { img = await new Promise((res, rej) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => rej({ code: "image" }); i.src = u; }); }
  const w = img.width, h = img.height, s = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85).split(",")[1];
}
function parseJsonLoose(t) {
  try { return JSON.parse(t); } catch (e) {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw { code: "json" };
}
async function geminiTicket(file, prompt, signal) {
  const data = await toJpegBase64(file);
  let models = Cfg.model ? [Cfg.model] : [];
  let lastErr = { code: "upstream" };
  for (let round = 0; round < 2; round++) {
    if (!models.length) models = await geminiModels();
    for (const m of models) {
      const r = await gemFetch(`/models/${encodeURIComponent(m)}:generateContent`, {
        method: "POST", signal, headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data } }] }], generationConfig: { temperature: 0, responseMimeType: "application/json" } }),
      });
      if (r.ok) {
        const j = await r.json();
        const txt = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
        if (!txt) { lastErr = { code: "json" }; continue; }
        if (Cfg.model !== m) { Cfg.model = m; saveCfg(); }
        return parseJsonLoose(txt);
      }
      const body = await r.text().catch(() => "");
      if ((r.status === 400 && /API key|API_KEY/i.test(body)) || r.status === 401 || r.status === 403) throw { code: "key" };
      lastErr = { code: r.status === 429 ? "rate" : "upstream" };
      if (r.status === 404 && Cfg.model === m) { delete Cfg.model; saveCfg(); }
    }
    if (lastErr.code === "rate") break;
    models = [];  // el modelo guardado falló: vuelve a buscar los disponibles
  }
  throw lastErr;
}

/* ---------- Leer un ticket con foto ---------- */
async function leerTicket(file) {
  if (!canTicket() || !F) return;
  const form = F;
  form.reading = true; form.warn = ""; form.info = ""; form.err = ""; renderMovForm();
  readCtl = new AbortController();
  const known = productStats(null).slice(0, 150).map(p => p.n);
  const prompt = `Eres un lector de tickets de compra de España. En la imagen hay un ticket. Extrae sus datos.
Responde SOLO con un objeto JSON con esta forma:
{"tienda": "Mercadona" | null, "fecha": "AAAA-MM-DD" | null, "total": 23.45 | null, "productos": [{"n": "Leche semidesnatada 1L", "q": 2, "p": 0.92, "t": 1.84}]}
Reglas:
- "n": nombre del producto claro y legible, sin códigos; expande abreviaturas evidentes (por ejemplo "LECHE SEMI" pasa a "Leche semidesnatada"). Escríbelo con mayúscula solo al principio.
- "q": unidades o kilos; "p": precio por unidad o por kilo; "t": importe de la línea. Números con punto decimal.
- Los descuentos y promociones van como un producto con "t" y "p" negativos (por ejemplo "Descuento 2ª unidad").
- No incluyas líneas de IVA, subtotales, entregado, cambio ni el método de pago.
- "total": el total pagado que aparece en el ticket.
- Si un producto coincide con alguno de esta lista de productos ya usados, escribe exactamente ese nombre: ${JSON.stringify(known)}
Si la imagen no es un ticket de compra, responde {"error": "no_ticket"}.`;
  try {
    const res = await geminiTicket(file, prompt, readCtl.signal);
    if (F !== form) return;
    if (!res || res.error || !Array.isArray(res.productos) || !res.productos.length) {
      form.warn = "No he reconocido un ticket en la foto. Prueba con una foto más cercana, recta y con buena luz, o apunta los productos a mano.";
    } else {
      const items = res.productos.map(it => {
        let q = +it.q, p = +it.p, t = +it.t;
        if (!(q > 0)) q = 1;
        if (isNaN(p) && !isNaN(t)) p = t / q;
        if (isNaN(p)) p = 0;
        if (!isNaN(t) && Math.abs(q * p - t) > 0.011) p = t / q;
        return { n: String(it.n || "").trim(), q: inpNum(Math.round(q * 1000) / 1000), p: inpNum(p), c: "" };
      }).filter(it => it.n);
      form.items = form.items.filter(it => it.n.trim()).concat(items);
      form.showItems = true;
      if (res.tienda && !form.tienda.trim()) { form.tienda = String(res.tienda).trim(); }
      if (validDate(res.fecha) && res.fecha <= todayStr()) form.fecha = res.fecha;
      F = form; guessCatFromStore();
      const sum = itemsSum();
      if (+res.total > 0 && Math.abs(sum - res.total) > 0.05) form.warn = `La suma de los productos (${fmt(sum)}) no cuadra con el total del ticket (${fmt(res.total)}). Revisa las líneas antes de guardar.`;
      else form.info = `He leído ${items.length} ${items.length === 1 ? "producto" : "productos"}. Revisa que estén bien y guarda.`;
    }
  } catch (e) {
    if (F !== form) return;
    const c = e?.code;
    if (c === "cancelled") form.info = "";
    else if (c === "key") form.warn = "Google no acepta tu clave de Gemini. Revísala en Plan → Leer tickets con Gemini.";
    else if (c === "rate") form.warn = "Has llegado al límite gratuito de Gemini por ahora. Espera un rato y vuelve a intentarlo, o apunta los productos a mano.";
    else if (c === "image") form.warn = "No puedo abrir esa imagen. Prueba con otra foto.";
    else if (c === "red") form.warn = "Para leer el ticket necesitas conexión a internet. Puedes apuntarlo a mano y se sincronizará luego.";
    else form.warn = "No he podido leer bien el ticket. Prueba con otra foto o apunta los productos a mano.";
  }
  readCtl = null;
  if (F === form) { form.reading = false; renderMovForm(); }
}

/* ---------- Detalle de producto ---------- */
function openProd(k) {
  const all = productStats(null).find(p => p.k === k); if (!all) return;
  const hist = [];
  for (const m of D().movs) if (m.tipo === "gasto") for (const it of m.items || []) if (norm(it.n) === k) hist.push({ fecha: m.fecha, tienda: m.tienda, q: +it.q || 0, p: +it.p || 0, t: +it.t || 0 });
  hist.sort((a, b) => b.fecha.localeCompare(a.fecha));
  const end = UI.view === "informes" ? UI.mkInf : curMk();
  const months = [...Array(6)].map((_, i) => addMonths(end, i - 5));
  const vals = months.map(mk => r2(hist.filter(h => h.fecha.startsWith(mk)).reduce((a, h) => a + h.t, 0)));
  const prices = hist.map(h => h.p).filter(p => p > 0);
  const minP = prices.length ? Math.min(...prices) : 0, maxP = prices.length ? Math.max(...prices) : 0;
  const first = hist[hist.length - 1], last = hist[0];
  const change = first && last && first.p > 0 && first !== last ? (last.p - first.p) / first.p : null;
  const body = `<div class="stats">
      <div class="stat"><span class="label">Gastado</span><span class="v">${esc(fmt(all.t))}</span></div>
      <div class="stat"><span class="label">Unidades</span><span class="v">${esc(fmtN(all.q, 3))}</span></div>
      <div class="stat"><span class="label">Último precio</span><span class="v">${esc(fmt(all.lastP))}</span></div></div>
    ${change != null && Math.abs(change) >= 0.005 ? `<div class="note ${change > 0 ? "warn" : ""}">Desde la primera vez que lo apuntaste (${esc(dateShort(first.fecha))}), su precio ha ${change > 0 ? "subido" : "bajado"} un ${esc(fmtN(Math.abs(change) * 100, 1))} %: de ${esc(fmt(first.p))} a ${esc(fmt(last.p))}.</div>` : ""}
    ${prices.length > 1 && maxP > minP ? `<p class="small muted" style="margin:0">Más barato: ${esc(fmt(minP))} · Más caro: ${esc(fmt(maxP))}</p>` : ""}
    <div class="panel chart"><div class="label" style="margin-bottom:6px">Gasto al mes</div>${miniBars(months, vals, end)}</div>
    <div class="panel flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Tienda</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Importe</th></tr></thead><tbody>
      ${hist.slice(0, 30).map(h => `<tr style="cursor:default"><td>${esc(dateShort(h.fecha))}</td><td>${esc(h.tienda || "—")}</td><td class="r">${esc(fmtN(h.q, 3))}</td><td class="r">${esc(fmt(h.p))}</td><td class="r">${esc(fmt(h.t))}</td></tr>`).join("")}
    </tbody></table></div></div>`;
  openSheet(all.n, body, "", {});
}

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function evoSvg(endMk) {
  const months = [...Array(6)].map((_, i) => addMonths(endMk, i - 5));
  const data = months.map(mk => ({ mk, ...totals(mk) }));
  const max = niceMax(Math.max(10, ...data.map(d => Math.max(d.ing, d.gas))));
  const W = 560, H = 230, L = 52, R = 8, T = 14, B = 30, iw = W - L - R, ih = H - T - B, bw = iw / 6, barW = Math.min(24, (bw - 18) / 2);
  const y = v => T + ih - (v / max) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos 6 meses">`;
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = y(v); s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" style="stroke:var(--line)" stroke-width="1"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${esc(fmtN(v, 0))} €</text>`; }
  data.forEach((d, i) => {
    const cx = L + i * bw + bw / 2;
    const sel = d.mk === endMk;
    const hi = Math.max(d.ing > 0 ? 2 : 0, ih - (y(d.ing) - T)), hg = Math.max(d.gas > 0 ? 2 : 0, ih - (y(d.gas) - T));
    s += `<rect x="${cx - barW - 2}" y="${T + ih - hi}" width="${barW}" height="${hi}" rx="3" style="fill:var(--good)" opacity="${sel ? 1 : 0.55}"><title>Ingresos de ${esc(monthLabel(d.mk))}: ${esc(fmt(d.ing))}</title></rect>`;
    s += `<rect x="${cx + 2}" y="${T + ih - hg}" width="${barW}" height="${hg}" rx="3" style="fill:var(--accent)" opacity="${sel ? 1 : 0.55}"><title>Gastos de ${esc(monthLabel(d.mk))}: ${esc(fmt(d.gas))}</title></rect>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" style="${sel ? "fill:var(--fg);font-weight:700" : ""}">${esc(monthShort(d.mk))}</text>`;
  });
  return s + `</svg>`;
}
function miniBars(months, vals, sel) {
  const W = 420, H = 130, T = 18, B = 24, ih = H - T - B, bw = W / months.length, max = Math.max(1, ...vals);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto en este producto por mes">`;
  months.forEach((mk, i) => {
    const h = vals[i] > 0 ? Math.max(2, vals[i] / max * ih) : 0, x = i * bw + bw / 2;
    s += `<rect x="${x - 15}" y="${T + ih - h}" width="30" height="${h}" rx="3" style="fill:var(--accent)" opacity="${mk === sel ? 1 : 0.55}"></rect>`;
    if (vals[i] > 0) s += `<text x="${x}" y="${T + ih - h - 5}" text-anchor="middle">${esc(fmtN(vals[i], 2))}</text>`;
    s += `<text x="${x}" y="${H - 6}" text-anchor="middle" style="${mk === sel ? "fill:var(--fg);font-weight:700" : ""}">${esc(monthShort(mk))}</text>`;
  });
  return s + `<line x1="0" x2="${W}" y1="${T + ih}" y2="${T + ih}" style="stroke:var(--line)"/></svg>`;
}

const dmy = s => s ? `${s.slice(8, 10)}/${s.slice(5, 7)}/${s.slice(0, 4)}` : "";

  const catIds = [...new Set([...aj().cats.map(c => c.id), ...months.flatMap(mk => Object.keys(catSpend(mk)))])];
  const porCat = catIds.map(id => { const row = { Categoría: catById(id).n }; let any = false; for (const mk of months) { const v = catSpend(mk)[id] || 0; row[cap(monthLabel(mk))] = v; if (v) any = true; } if (scope !== "todo") row.Presupuesto = +catById(id).p || ""; return any || row.Presupuesto ? row : null; }).filter(Boolean);

  const add = (mk, d, o) => { if (mk === cm && d > today) return; st.movs["d" + (n++)] = { creado: n, mod: n, concepto: "", ...o, fecha: `${mk}-${pad(Math.min(d, daysIn(mk)))}` }; };
  const it = (k, q, f, c) => { const p = r2(P[k][1] * f); const o = { n: P[k][0], q, p, t: r2(q * p) }; if (c) o.c = c; return o; };
  const compra = (mk, d, tienda, metodo, items) => add(mk, d, { tipo: "gasto", importe: r2(items.reduce((a, i) => a + i.t, 0)), cat: "super", metodo, cuenta: metodo === "efectivo" ? "efectivo" : "banco", tienda, items });
  const gasto = (mk, d, tienda, cat, metodo, importe, extra = {}) => add(mk, d, { tipo: "gasto", importe, cat, metodo, cuenta: metodo === "efectivo" ? "efectivo" : "banco", tienda, ...extra });
  const months = [[addMonths(cm, -5), 0.97, 390], [addMonths(cm, -4), 0.98, 340], [addMonths(cm, -3), 0.99, 410], [addMonths(cm, -2), 1, 420], [addMonths(cm, -1), 1.03, 365], [cm, 1.06, 455]];
  for (const [mk, f, sueldo] of months) {
    add(mk, 1, { tipo: "ingreso", importe: 150, cat: "familia", cuenta: "banco", concepto: "Ayuda de casa" });
    add(mk, 3, { tipo: "ingreso", importe: sueldo, cat: "trabajo", cuenta: "banco", concepto: "Clases particulares" });
    gasto(mk, 1, "Alquiler habitación", "casa", "tarjeta", 280, { fijo: "fAlq" });
    gasto(mk, 5, "Tarifa móvil", "casa", "tarjeta", 9.99, { fijo: "fMov" });
    if (mk !== cm) gasto(mk, 12, "Spotify", "subs", "tarjeta", 6.99, { fijo: "fSpo" });
    compra(mk, 4, "Mercadona", "tarjeta", [it("leche", 6, f), it("huevos", 1, f), it("pan", 1, f), it("pasta", 2, f), it("tomate", 3, f), it("pollo", 1, f), it("platano", 1, f), it("yogur", 1, f)]);
    add(mk, 6, { tipo: "traspaso", importe: 40, cuenta: "banco", destino: "efectivo", concepto: "Sacar del cajero" });
    gasto(mk, 9, "Bar La Flor", "comer", "efectivo", 12.5);
    compra(mk, 11, "Lidl", "tarjeta", [it("cafe", 1, f), it("arroz", 1, f), it("atun", 1, f), it("manzana", 1, f), it("champu", 1, f, "salud"), it("queso", 1, f)]);
    gasto(mk, 14, "Cine", "ocio", "bizum", 7.5);
    compra(mk, 18, "Mercadona", "tarjeta", [it("leche", 6, f), it("pan", 1, f), it("pollo", 1, f), it("yogur", 1, f), it("aceite", 1, f), it("platano", 1, f)]);
    gasto(mk, 21, "Telepizza", "comer", "tarjeta", 15.9);
    compra(mk, 25, "Día", "efectivo", [it("pasta", 2, f), it("tomate", 2, f), it("huevos", 1, f), it("leche", 3, f)]);
    gasto(mk, 27, "Abono de transporte", "transp", "tarjeta", 20);
  }
  const fx = (id, o) => { st.fijos[id] = { creado: Object.keys(st.fijos).length, activo: true, mesIni: 1, ...o }; };
  fx("fAlq", { n: "Alquiler habitación", importe: 280, dia: 1, freq: "mensual", cat: "casa", metodo: "tarjeta" });
  fx("fMov", { n: "Tarifa móvil", importe: 9.99, dia: 5, freq: "mensual", cat: "casa", metodo: "tarjeta" });
  fx("fSpo", { n: "Spotify", importe: 6.99, dia: 12, freq: "mensual", cat: "subs", metodo: "tarjeta" });
  fx("fGym", { n: "Gimnasio universitario", importe: 45, dia: Math.min(28, today + 4), freq: "trimestral", mesIni: +cm.slice(5), cat: "ocio", metodo: "tarjeta" });
  st.metas.m1 = { n: "Viaje de verano", objetivo: 600, aportado: 180, limite: `${+cm.slice(0, 4) + 1}-06-30`, creado: 1 };
  st.metas.m2 = { n: "Colchón para imprevistos", objetivo: 1000, aportado: 250, limite: "", creado: 2 };
  const aj0 = clone(DEFAULTS);
  const bud = { super: 150, comer: 30, transp: 25, casa: 300, subs: 15, ocio: 25, ropa: 30, salud: 15 };
  for (const c of aj0.cats) c.p = bud[c.id] || 0;
  aj0.cuentas = [{ id: "banco", n: "Banco", ini: 320 }, { id: "efectivo", n: "Efectivo", ini: 15 }];
  st.aj = aj0;
  demoOn = true; demoBackend.subscribe();
  closeSheet(); go("inicio");
  toast("Datos de ejemplo cargados. Prueba a tocar cualquier cosa.");
}
function stopDemo() { demoOn = false; Demo = null; demoBackend = null; UI.budDraft = {}; closeSheet(); go("inicio"); Sync.soon(300); }

/* =========================================================
   Eventos
   ========================================================= */
document.addEventListener("click", e => {
  if (e.target.closest("#sheet")) return;
  const t = e.target.closest("button, tr[data-prod]"); if (!t) return;
  const ds = t.dataset;
  if (ds.view) return go(ds.view);
  if (t.id === "navAdd") return openMovForm();
  if (t.id === "demoExit") return stopDemo();
  if (ds.go) return go(ds.go);
  if (ds.mov) return openMovDetail(ds.mov);
  if (ds.prod) return openProd(ds.prod);
  if (ds.mprev) { UI[ds.mprev] = addMonths(UI[ds.mprev], -1); return render(); }
  if (ds.mnext) { UI[ds.mnext] = addMonths(UI[ds.mnext], 1); return render(); }
  if (ds.ftipo) { UI.fTipo = ds.ftipo; return render(); }
  if (ds.payfijo) return payFijo(ds.payfijo);
  if (ds.fijo) return openFijoForm(ds.fijo);
  if (ds.meta) return openMetaForm(ds.meta);
  if (ds.aportar) return openAportar(ds.aportar);
  if (ds.acct) return openCuenta(ds.acct);
  if (ds.cat) return openCat(ds.cat);
  const act = ds.act;
  if (act === "newGasto") return openMovForm();
  if (act === "quickTicket") { openMovForm(); const p = $("#fPhoto"); if (p) p.click(); return; }
  if (act === "addFijo") return openFijoForm();
  if (act === "addMeta") return openMetaForm();
  if (act === "addAcct") return openCuenta();
  if (act === "addCat") return openCat();
  if (act === "saveBud") return saveBudgets();
  if (act === "export") return openExport();
  if (act === "backup") return backup();
  if (act === "demoStart") return startDemo();
  if (act === "syncCfg") return openSyncCfg();
  if (act === "gemCfg") return openGemCfg();
  if (act === "syncNow") return Sync.run();
});
document.addEventListener("input", e => {
  if (e.target.closest("#sheet")) return;
  const t = e.target;
  if (t.id === "qMovs") { UI.q = t.value; render(); }
  else if (t.id === "qProd") { UI.qProd = t.value; render(); }
  else if (t.dataset.bud) UI.budDraft[t.dataset.bud] = t.value;
});
const sheetEl = $("#sheet");
sheetEl.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeSheet();
  if (Sheet.onClick) Sheet.onClick(e);
});
sheetEl.addEventListener("input", e => { if (Sheet.onInput) Sheet.onInput(e); });
sheetEl.addEventListener("change", e => { if (Sheet.onChange) Sheet.onChange(e); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* =========================================================
   Ajustes de sincronización y de Gemini
   ========================================================= */
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
const makeCode = () => "CC1." + b64e(JSON.stringify({ u: Cfg.url, k: Cfg.key, g: Cfg.gemini || "" }));
function readCode(txt) {
  const m = String(txt || "").trim().match(/CC1\.([A-Za-z0-9_-]+)/); if (!m) return null;
  try { const o = JSON.parse(b64d(m[1])); return o && o.u && o.k ? o : null; } catch (e) { return null; }
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("Copiado"); }
  catch (e) { toast("No se pudo copiar. Mantén pulsado el código y cópialo a mano."); }
}
function queueAllLocal() {
  for (const col of Object.keys(LD)) for (const [id, rec] of Object.entries(LD[col])) {
    if (!OUT.some(o => o.col === col && o.id === id)) OUT.push({ col, id, mod: rec.mod || Date.now(), del: false, data: rec });
  }
  persistLocal();
}
function openSyncCfg() {
  if (demoOn) { toast("Sal del ejemplo para configurar la sincronización."); return; }
  const S = { url: Cfg.url || "", key: Cfg.key || "", busy: false, err: "", gem: "" };
  const draw = () => {
    const st = $("#sheet").hidden ? 0 : $("#sheetBody").scrollTop;
    const b = `${S.err ? `<div class="note bad">${esc(S.err)}</div>` : ""}
      ${Cfg.url ? `<div class="panel" style="display:flex;flex-direction:column;gap:8px"><span>${Sync.state === "error" ? `<span class="pill bad">Error</span> ${esc(Sync.err)}` : `<span class="pill good">Conectada</span> Última sincronización ${esc(lastSyncText())}${OUT.length ? ` · ${OUT.length} cambios pendientes` : ""}`}</span>
        <div class="btns"><button type="button" class="btn small" data-k="now">Sincronizar ahora</button></div></div>` : `<p class="muted" style="margin:0">Pega la dirección de la aplicación web de tu hoja y la clave que aparece al principio del script. Los pasos están en la guía de instalación.</p>`}
      <label class="field"><span>Dirección del script</span><input class="inp" id="sUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.url)}"></label>
      <label class="field"><span>Clave</span><input class="inp" id="sKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="La que pone CLAVE en el script" value="${esc(S.key)}"></label>
      <div class="field"><span>¿Ya lo configuraste en otro dispositivo?</span><textarea class="inp" id="sCode" placeholder="Pega aquí el código de configuración (empieza por CC1.)"></textarea></div>
      ${Cfg.url ? `<div class="field"><span>Código para tu otro dispositivo</span><div class="code">${esc(makeCode())}</div>
        <div class="btns"><button type="button" class="btn small" data-k="copy">Copiar código</button></div>
        <span class="small muted">Pégalo en la app del otro dispositivo para conectarlo sin escribir nada. ${Cfg.gemini ? "Incluye tu clave de Gemini. " : ""}No lo compartas con nadie.</span></div>
        <button type="button" class="link" data-k="off" style="align-self:flex-start;color:var(--bad)">Desconectar la hoja en este dispositivo</button>` : ""}`;
    const foot = `<button class="btn" data-close>Cerrar</button><button class="btn primary" data-k="save" ${S.busy ? "disabled" : ""}>${S.busy ? `<span class="spin"></span>Probando…` : "Probar y guardar"}</button>`;
    openSheet("Hoja de Google", b, foot, {
      onInput(e) {
        const t = e.target;
        if (t.id === "sUrl") S.url = t.value.trim();
        if (t.id === "sKey") S.key = t.value.trim();
        if (t.id === "sCode") { const o = readCode(t.value); if (o) { S.url = o.u; S.key = o.k; S.gem = o.g || ""; S.err = ""; draw(); toast("Código leído. Toca «Probar y guardar»."); } }
      },
      async onClick(e) {
        const t = e.target.closest("button"); if (!t) return;
        const k = t.dataset.k;
        if (k === "copy") return copyText(makeCode());
        if (k === "now") { await Sync.run(); return draw(); }
        if (k === "off") return armDelete(t, () => { delete Cfg.url; delete Cfg.key; saveCfg(); LS.set(K.sync, { since: 0 }); Sync.state = "idle"; closeSheet(); render(); toast("Hoja desconectada. Tus datos siguen en este dispositivo."); });
        if (k === "save" && !S.busy) {
          if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(S.url)) { S.err = "La dirección tiene que empezar por https://script.google.com/"; return draw(); }
          if (!S.key) { S.err = "Escribe la clave del script."; return draw(); }
          S.busy = true; S.err = ""; draw();
          try {
            await callSheet({ action: "ping" }, { url: S.url, key: S.key });
            const changed = Cfg.url !== S.url;
            Cfg.url = S.url; Cfg.key = S.key; if (S.gem) { Cfg.gemini = S.gem; delete Cfg.model; }
            saveCfg();
            if (changed) { LS.set(K.sync, { since: 0 }); queueAllLocal(); }
            closeSheet(); render(); toast("Hoja conectada. Sincronizando…");
            Sync.run();
          } catch (err) { S.busy = false; S.err = SYNC_ERR[err && err.code] || SYNC_ERR.red; draw(); }
        }
      },
    });
    $("#sheetBody").scrollTop = st;
  };
  draw();
}
function openGemCfg() {
  const S = { key: Cfg.gemini || "", busy: false, err: "" };
  const draw = () => openSheet("Leer tickets con Gemini", `${S.err ? `<div class="note bad">${esc(S.err)}</div>` : ""}
      <p class="muted" style="margin:0">Gemini es la IA de Google. Con una clave gratuita, la app lee los productos y precios de la foto del ticket. Consíguela en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> con tu cuenta de Google.</p>
      <label class="field"><span>Clave de Gemini</span><input class="inp" id="gKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…" value="${esc(S.key)}"></label>
      <p class="note" style="margin:0">Con la clave gratuita, Google puede usar las fotos que envíes para mejorar sus modelos. Un ticket de súper no suele tener datos sensibles, pero evita fotografiar documentos con tu nombre, DNI o datos bancarios.</p>
      ${Cfg.gemini ? `<button type="button" class="link" data-k="off" style="align-self:flex-start;color:var(--bad)">Quitar la clave de este dispositivo</button>` : ""}`,
    `<button class="btn" data-close>Cerrar</button><button class="btn primary" data-k="save" ${S.busy ? "disabled" : ""}>${S.busy ? `<span class="spin"></span>Probando…` : "Probar y guardar"}</button>`, {
      onInput(e) { if (e.target.id === "gKey") S.key = e.target.value.trim(); },
      async onClick(e) {
        const t = e.target.closest("button"); if (!t) return;
        if (t.dataset.k === "off") return armDelete(t, () => { delete Cfg.gemini; delete Cfg.model; saveCfg(); closeSheet(); render(); });
        if (t.dataset.k === "save" && !S.busy) {
          if (!S.key) { S.err = "Pega tu clave de Gemini."; return draw(); }
          S.busy = true; S.err = ""; draw();
          try {
            const list = await geminiModels(S.key);
            if (!list.length) throw { code: "nomodel" };
            Cfg.gemini = S.key; delete Cfg.model; saveCfg();
            closeSheet(); render(); toast("Lectura de tickets activada");
          } catch (err) {
            S.busy = false;
            S.err = err && err.code === "key" ? "Google no acepta esa clave. Cópiala de nuevo desde AI Studio." : err && err.code === "nomodel" ? "Tu clave funciona, pero no tiene ningún modelo Flash disponible." : "No se pudo comprobar la clave. Revisa tu conexión.";
            draw();
          }
        }
      },
    });
  draw();
}

/* =========================================================
   Arranque
   ========================================================= */
function init() {
  backend = localBackend(); mode = "local";
  backend.subscribe();
  render();
  Sync.run();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") Sync.soon(200); });
  window.addEventListener("online", () => Sync.soon(200));
  window.addEventListener("offline", updateStatus);
  setInterval(() => { if (document.visibilityState === "visible" && !Sync.running) Sync.run(); }, 60000);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
init();
</script>
