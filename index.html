}

/* ---------- Gemini (Google) para leer tickets ---------- */
const GEM = "https://generativelanguage.googleapis.com/v1beta";
async function gemFetch(path, opts = {}, key = Cfg.gemini) {
  try { return await fetch(GEM + path, { ...opts, headers: { "x-goog-api-key": key, ...(opts.headers || {}) } }); }
  catch (e) { if (e && e.name === "AbortError") throw { code: "cancelled" }; throw { code: "red" }; }
}
async function geminiModels(key = Cfg.gemini) {
  // Elige el modelo «Flash» más reciente que tu clave pueda usar
  const r = await gemFetch("/models?pageSize=200", {}, key);
  if (r.status === 400 || r.status === 401 || r.status === 403) throw { code: "key" };
  if (!r.ok) throw { code: "upstream" };
  const j = await r.json();
  const names = (j.models || []).filter(m => (m.supportedGenerationMethods || []).includes("generateContent")).map(m => String(m.name).replace(/^models\//, ""));
  const ok = names.filter(n => /^gemini-/.test(n) && /flash/.test(n) && !/(image|tts|audio|live|embedding|exp|thinking|8b)/.test(n));
  const ver = n => { const m = n.match(/^gemini-(\d+(?:\.\d+)?)/); return m ? parseFloat(m[1]) : 0; };
  const score = n => ver(n) * 10 - (/lite/.test(n) ? 3 : 0) - (/preview/.test(n) ? 1 : 0) - (/-\d{3,}$/.test(n) ? 0.5 : 0);
  const list = ok.sort((a, b) => score(b) - score(a));
  if (names.includes("gemini-flash-latest")) list.unshift("gemini-flash-latest");
  return [...new Set(list)].slice(0, 5);
}
async function toJpegBase64(file, maxSide = 2000) {
  let img;
  try { img = await createImageBitmap(file); }
  catch (e) { img = await new Promise((res, rej) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => { URL.revokeObjectURL(u); res(i); }; i.onerror = () => rej({ code: "image" }); i.src = u; }); }
  const w = img.width, h = img.height, s = Math.min(1, maxSide / Math.max(w, h));
  const c = document.createElement("canvas"); c.width = Math.round(w * s); c.height = Math.round(h * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return c.toDataURL("image/jpeg", 0.85).split(",")[1];
}
function parseJsonLoose(t) {
  try { return JSON.parse(t); } catch (e) {}
  const a = t.indexOf("{"), b = t.lastIndexOf("}");
  if (a >= 0 && b > a) { try { return JSON.parse(t.slice(a, b + 1)); } catch (e) {} }
  throw { code: "json" };
}
async function geminiTicket(file, prompt, signal) {
  const data = await toJpegBase64(file);
  let models = Cfg.model ? [Cfg.model] : [];
  let lastErr = { code: "upstream" };
  for (let round = 0; round < 2; round++) {
    if (!models.length) models = await geminiModels();
    for (const m of models) {
      const r = await gemFetch(`/models/${encodeURIComponent(m)}:generateContent`, {
        method: "POST", signal, headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }, { inline_data: { mime_type: "image/jpeg", data } }] }], generationConfig: { temperature: 0, responseMimeType: "application/json" } }),
      });
      if (r.ok) {
        const j = await r.json();
        const txt = (j.candidates?.[0]?.content?.parts || []).map(p => p.text || "").join("");
        if (!txt) { lastErr = { code: "json" }; continue; }
        if (Cfg.model !== m) { Cfg.model = m; saveCfg(); }
        return parseJsonLoose(txt);
      }
      const body = await r.text().catch(() => "");
      if ((r.status === 400 && /API key|API_KEY/i.test(body)) || r.status === 401 || r.status === 403) throw { code: "key" };
      lastErr = { code: r.status === 429 ? "rate" : "upstream" };
      if (r.status === 404 && Cfg.model === m) { delete Cfg.model; saveCfg(); }
    }
    if (lastErr.code === "rate") break;
    models = [];  // el modelo guardado falló: vuelve a buscar los disponibles
  }
  throw lastErr;
}

/* ---------- Leer un ticket con foto ---------- */
async function leerTicket(file) {
  if (!canTicket() || !F) return;
  const form = F;
  form.reading = true; form.warn = ""; form.info = ""; form.err = ""; renderMovForm();
  readCtl = new AbortController();
  const known = productStats(null).slice(0, 150).map(p => p.n);
  const prompt = `Eres un lector de tickets de compra de España. En la imagen hay un ticket. Extrae sus datos.
Responde SOLO con un objeto JSON con esta forma:
{"tienda": "Mercadona" | null, "fecha": "AAAA-MM-DD" | null, "total": 23.45 | null, "productos": [{"n": "Leche semidesnatada 1L", "q": 2, "p": 0.92, "t": 1.84}]}
Reglas:
- "n": nombre del producto claro y legible, sin códigos; expande abreviaturas evidentes (por ejemplo "LECHE SEMI" pasa a "Leche semidesnatada"). Escríbelo con mayúscula solo al principio.
- "q": unidades o kilos; "p": precio por unidad o por kilo; "t": importe de la línea. Números con punto decimal.
- Los descuentos y promociones van como un producto con "t" y "p" negativos (por ejemplo "Descuento 2ª unidad").
- No incluyas líneas de IVA, subtotales, entregado, cambio ni el método de pago.
- "total": el total pagado que aparece en el ticket.
- Si un producto coincide con alguno de esta lista de productos ya usados, escribe exactamente ese nombre: ${JSON.stringify(known)}
Si la imagen no es un ticket de compra, responde {"error": "no_ticket"}.`;
  try {
    const res = await geminiTicket(file, prompt, readCtl.signal);
    if (F !== form) return;
    if (!res || res.error || !Array.isArray(res.productos) || !res.productos.length) {
      form.warn = "No he reconocido un ticket en la foto. Prueba con una foto más cercana, recta y con buena luz, o apunta los productos a mano.";
    } else {
      const items = res.productos.map(it => {
        let q = +it.q, p = +it.p, t = +it.t;
        if (!(q > 0)) q = 1;
        if (isNaN(p) && !isNaN(t)) p = t / q;
        if (isNaN(p)) p = 0;
        if (!isNaN(t) && Math.abs(q * p - t) > 0.011) p = t / q;
        return { n: String(it.n || "").trim(), q: inpQ(q), p: inpNum(p), c: "" };
      }).filter(it => it.n);
      form.items = form.items.filter(it => it.n.trim()).concat(items);
      form.showItems = true;
      if (res.tienda && !form.tienda.trim()) { form.tienda = String(res.tienda).trim(); }
      if (validDate(res.fecha) && res.fecha <= todayStr()) form.fecha = res.fecha;
      F = form; guessCatFromStore();
      const sum = itemsSum();
      if (+res.total > 0 && Math.abs(sum - res.total) > 0.05) form.warn = `La suma de los productos (${fmt(sum)}) no cuadra con el total del ticket (${fmt(res.total)}). Revisa las líneas antes de guardar.`;
      else form.info = `He leído ${items.length} ${items.length === 1 ? "producto" : "productos"}. Revisa que estén bien y guarda.`;
    }
  } catch (e) {
    if (F !== form) return;
    const c = e?.code;
    if (c === "cancelled") form.info = "";
    else if (c === "key") form.warn = "Google no acepta tu clave de Gemini. Revísala en Plan → Leer tickets con Gemini.";
    else if (c === "rate") form.warn = "Has llegado al límite gratuito de Gemini por ahora. Espera un rato y vuelve a intentarlo, o apunta los productos a mano.";
    else if (c === "image") form.warn = "No puedo abrir esa imagen. Prueba con otra foto.";
    else if (c === "red") form.warn = "Para leer el ticket necesitas conexión a internet. Puedes apuntarlo a mano y se sincronizará luego.";
    else form.warn = "No he podido leer bien el ticket. Prueba con otra foto o apunta los productos a mano.";
  }
  readCtl = null;
  if (F === form) { form.reading = false; renderMovForm(); }
}

    ${prices.length > 1 && maxP > minP ? `<p class="small muted" style="margin:0">Más barato: ${esc(fmt(minP))} · Más caro: ${esc(fmt(maxP))}</p>` : ""}
    <div class="panel chart"><div class="label" style="margin-bottom:6px">Gasto al mes</div>${miniBars(months, vals, end)}</div>
    <div class="panel flush"><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Fecha</th><th>Tienda</th><th class="r">Cant.</th><th class="r">Precio</th><th class="r">Importe</th></tr></thead><tbody>
      ${hist.slice(0, 30).map(h => `<tr style="cursor:default"><td>${esc(dateShort(h.fecha))}</td><td>${esc(h.tienda || "—")}</td><td class="r">${esc(fmtN(h.q, 3))}</td><td class="r">${esc(fmt(h.p))}</td><td class="r">${esc(fmt(h.t))}</td></tr>`).join("")}

}

function niceMax(v) { const p = Math.pow(10, Math.floor(Math.log10(v))); const n = v / p; return (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * p; }
function evoSvg(endMk) {
  const months = [...Array(6)].map((_, i) => addMonths(endMk, i - 5));
  const data = months.map(mk => ({ mk, ...totals(mk) }));
  const max = niceMax(Math.max(10, ...data.map(d => Math.max(d.ing, d.gas))));
  const W = 560, H = 230, L = 52, R = 8, T = 14, B = 30, iw = W - L - R, ih = H - T - B, bw = iw / 6, barW = Math.min(24, (bw - 18) / 2);
  const y = v => T + ih - (v / max) * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ingresos y gastos de los últimos 6 meses">`;
  for (let i = 0; i <= 4; i++) { const v = max * i / 4, yy = y(v); s += `<line x1="${L}" x2="${W - R}" y1="${yy}" y2="${yy}" style="stroke:var(--line)" stroke-width="1"/><text x="${L - 8}" y="${yy + 4}" text-anchor="end">${esc(fmtN(v, 0))} €</text>`; }
  data.forEach((d, i) => {
    const cx = L + i * bw + bw / 2;
    const sel = d.mk === endMk;
    const hi = Math.max(d.ing > 0 ? 2 : 0, ih - (y(d.ing) - T)), hg = Math.max(d.gas > 0 ? 2 : 0, ih - (y(d.gas) - T));
    s += `<rect x="${cx - barW - 2}" y="${T + ih - hi}" width="${barW}" height="${hi}" rx="3" style="fill:var(--good)" opacity="${sel ? 1 : 0.55}"><title>Ingresos de ${esc(monthLabel(d.mk))}: ${esc(fmt(d.ing))}</title></rect>`;
    s += `<rect x="${cx + 2}" y="${T + ih - hg}" width="${barW}" height="${hg}" rx="3" style="fill:var(--accent)" opacity="${sel ? 1 : 0.55}"><title>Gastos de ${esc(monthLabel(d.mk))}: ${esc(fmt(d.gas))}</title></rect>`;
    s += `<text x="${cx}" y="${H - 8}" text-anchor="middle" style="${sel ? "fill:var(--fg);font-weight:700" : ""}">${esc(monthShort(d.mk))}</text>`;
  });
  return s + `</svg>`;
}
function miniBars(months, vals, sel) {
  const W = 420, H = 130, T = 18, B = 24, ih = H - T - B, bw = W / months.length, max = Math.max(1, ...vals);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gasto en este producto por mes">`;
  months.forEach((mk, i) => {
    const h = vals[i] > 0 ? Math.max(2, vals[i] / max * ih) : 0, x = i * bw + bw / 2;
    s += `<rect x="${x - 15}" y="${T + ih - h}" width="30" height="${h}" rx="3" style="fill:var(--accent)" opacity="${mk === sel ? 1 : 0.55}"></rect>`;
    if (vals[i] > 0) s += `<text x="${x}" y="${T + ih - h - 5}" text-anchor="middle">${esc(fmtN(vals[i], 2))}</text>`;
    s += `<text x="${x}" y="${H - 6}" text-anchor="middle" style="${mk === sel ? "fill:var(--fg);font-weight:700" : ""}">${esc(monthShort(mk))}</text>`;
  });

}

function pickFile(accept) {
  return new Promise(res => {
    const i = document.createElement("input"); i.type = "file"; i.accept = accept;
    i.onchange = () => res(i.files && i.files[0] || null);

async function readText(file) {
  const buf = await file.arrayBuffer();
  // Muchos bancos españoles exportan en Windows-1252: si no es UTF-8 válido, se lee así
  try { return new TextDecoder("utf-8", { fatal: true }).decode(buf); } catch (e) { return new TextDecoder("windows-1252").decode(buf); }
}

function parseCSV(text) {
  const lines = text.replace(/^﻿/, "").split(/\r?\n/).filter(l => l.trim());
  const sample = lines.slice(0, 15).join("\n");
  const delim = [";", "\t", ",", "|"].map(d => [d, (sample.match(new RegExp(d === "|" ? "\\|" : d, "g")) || []).length]).sort((a, b) => b[1] - a[1])[0][0];
  return lines.map(line => {
    const out = []; let cur = "", q = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (q) { if (ch === '"') { if (line[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
      else if (ch === '"') q = true; else if (ch === delim) { out.push(cur.trim()); cur = ""; } else cur += ch;
    }
    out.push(cur.trim());
    return out;
  });
}
function parseFechaBanco(v) {
  if (typeof v === "number" && v > 20000 && v < 80000) { const d = new Date(Math.round((v - 25569) * 864e5)); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth() + 1)}-${pad(d.getUTCDate())}`; }

  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (m) { const y = m[3].length === 2 ? "20" + m[3] : m[3]; const r = `${y}-${pad(+m[2])}-${pad(+m[1])}`; return validDate(r) ? r : null; }
  return null;
}
const parseImporteBanco = v => typeof v === "number" ? v : parseNum(String(v ?? "").replace(/[−–]/g, "-").replace(/[^\d,.\-]/g, ""));
function limpiaConcepto(s) {
  let t = String(s || "").replace(/\s+/g, " ").trim();
  t = t.replace(/^(compra|pago|cargo|adeudo|recibo|abono|transferencia|transf\.?|bizum)\s+(con\s+)?(en\s+)?(tarj(eta)?\.?|tarj\.?\s*credito|tarj\.?\s*debito|movil|apple pay|google pay|contactless)?\s*(en\s+)?/i, "");
  t = t.replace(/\b\d{4,}[*x\d]*\b/gi, "").replace(/\b\d{1,2}[\/.\-]\d{1,2}([\/.\-]\d{2,4})?\b/g, "").replace(/\b(tarj(eta)?|card|n[º°o]\.?)\b\.?/gi, "").replace(/\s{2,}/g, " ").replace(/^[\s,.\-:]+|[\s,.\-:]+$/g, "");
  t = t.replace(/^(de|a|para|desde)\s+/i, "");
  if (!t) return String(s || "").trim();
  return t === t.toUpperCase() ? t.toLowerCase().replace(/(^|\s)\S/g, c => c.toUpperCase()) : t;
}

  const S = { cta: aj().cuentas.some(c => c.id === "banco") ? "banco" : aj().cuentas[0].id };
  const mark = async items => {
    const byMov = new Map();
    for (const it of items) { if (!byMov.has(it.m.id)) byMov.set(it.m.id, { m: it.m, idx: [] }); byMov.get(it.m.id).idx.push(it.i); }
    const ops = [...byMov.values()].map(({ m, idx }) => ({ col: "movs", id: m.id, data: { ...stripId(m), reparto: reparto(m).map((r, i) => idx.includes(i) ? { ...r, ok: todayStr(), cta: S.cta } : r) } }));
    if (await save(() => W().many(ops))) { vibrate(); toast(`Apuntado: ${x.n} te ha devuelto ${fmt(items.reduce((a, it) => a + +it.r.i, 0))}`); }
  };
  openSheet(`${x.n} te debe ${fmt(x.t)}`, `<div class="panel flush list">${x.items.map((it, j) => `<div class="row">${movDot(it.m)}<span style="min-width:0"><span class="t" style="display:block">${esc(movTitle(it.m))}</span><span class="s" style="display:block">${esc(cap(dateShort(it.m.fecha)))} · total ${esc(fmt(it.m.importe))}</span></span>
      <span style="display:flex;flex-direction:column;align-items:flex-end;gap:5px"><span class="a in">${esc(fmt(it.r.i))}</span><button class="btn small" data-paid="${j}">Devuelto</button></span></div>`).join("")}</div>
    <div class="field"><span>¿Dónde lo has recibido?</span>${chipsHtml("dcta", aj().cuentas, S.cta)}</div>
    <p class="small muted" style="margin:0">Lo devuelto entra en esa cuenta pero no cuenta como ingreso: solo deja de estar pendiente.</p>`,
    `<button class="btn" data-close>Cerrar</button><button class="btn primary" data-k="all">Me lo ha devuelto todo</button>`, {
      async onClick(e) {
        const t = e.target.closest("button"); if (!t) return; const ds = t.dataset;
        if (ds.dcta) { S.cta = ds.dcta; return pressChip("dcta", ds.dcta); }
        if (ds.paid != null) { await mark([x.items[+ds.paid]]); return deudas().some(d => d.k === k) ? openDebe(k) : closeSheet(); }
        if (ds.k === "all") { await mark(x.items); closeSheet(); }
      },
    });
}

const darkMQ = window.matchMedia("(prefers-color-scheme: dark)");
function applyTheme() {
  const root = document.documentElement;
  const dark = Prefs.theme === "dark" || (Prefs.theme === "auto" && darkMQ.matches);
  if (Prefs.theme === "auto") root.removeAttribute("data-theme"); else root.dataset.theme = Prefs.theme;
  const a = (ACCENTS[Prefs.accent] || ACCENTS.azul)[dark ? "d" : "l"];
  for (const [k, v] of [["--accent", a[0]], ["--accent-ink", a[1]], ["--accent-soft", a[2]]]) Prefs.accent === "azul" ? root.style.removeProperty(k) : root.style.setProperty(k, v);
  for (const m of $$('meta[name="theme-color"]')) { if (Prefs.theme === "auto") m.content = m.media.includes("dark") ? "#0D1116" : "#EDF0F4"; else m.content = dark ? "#0D1116" : "#EDF0F4"; }
}
darkMQ.addEventListener?.("change", () => { if (Prefs.theme === "auto") applyTheme(); });
function openLook() {

function handleLaunch() {
  const p = new URLSearchParams(location.search);
  const nuevo = p.get("nuevo"), texto = p.get("texto");
  if (!nuevo && !texto) return;
  history.replaceState(null, "", location.pathname);
  if (texto) return openQuick({ texto });
  if (nuevo === "ingreso") return openMovForm(null, { tipo: "ingreso" });
  if (nuevo === "ticket" && canTicket()) { openMovForm(); return; }
  openQuick();
}

/* ---------- Gestos: deslizar filas y bajar la hoja para cerrarla ---------- */
let swipe = null, swipedAt = 0;
document.addEventListener("pointerdown", e => {
  if (e.pointerType === "mouse") return;
  const w = e.target.closest(".sw-wrap");
  if (w && !w.closest("#sheet")) { swipe = { w, row: w.querySelector(".row"), x: e.clientX, y: e.clientY, dx: 0, on: false }; return; }
  const h = e.target.closest(".sheet-h, .grab");
  if (h && !e.target.closest("button") && window.matchMedia("(max-width:699px)").matches) swipe = { sheet: $("#sheet .sheet"), y: e.clientY, dy: 0, on: false };
}, { passive: true });
document.addEventListener("pointermove", e => {
  if (!swipe) return;
  if (swipe.sheet) {
    const dy = e.clientY - swipe.y; if (!swipe.on && dy > 8) { swipe.on = true; swipe.sheet.classList.add("dragging"); }
    if (swipe.on) { swipe.dy = Math.max(0, dy); swipe.sheet.style.transform = `translateY(${swipe.dy}px)`; }
    return;
  }
  const dx = e.clientX - swipe.x, dy = e.clientY - swipe.y;
  if (!swipe.on) {
    if (Math.abs(dy) > 10 && Math.abs(dy) > Math.abs(dx)) { swipe = null; return; }
    if (Math.abs(dx) < 14) return;
    swipe.on = true; swipe.w.classList.add("dragging");
  }
  swipe.dx = Math.max(-160, Math.min(160, dx));
  swipe.row.style.transform = `translateX(${swipe.dx}px)`;
  swipe.w.dataset.dir = swipe.dx < 0 ? "del" : "rep";
}, { passive: true });
function endSwipe() {
  const s = swipe; swipe = null; if (!s || !s.on) return;
  swipedAt = Date.now();
  if (s.sheet) {
    s.sheet.classList.remove("dragging");
    if (s.dy > 110) { closeSheet(); s.sheet.style.transform = ""; } else s.sheet.style.transform = "";
    return;
  }
  s.w.classList.remove("dragging"); s.row.style.transform = "";
  const m = D().movs.find(x => x.id === s.w.dataset.swipe);
  setTimeout(() => { if (s.w.isConnected) delete s.w.dataset.dir; }, 200);
  if (!m) return;
  if (s.dx < -90) delMovUndo(m);
  else if (s.dx > 90) { vibrate(); if (m.tipo === "traspaso") openMovForm(m, { repeat: true }); else openMovForm(m, { repeat: true }); }
}
document.addEventListener("pointerup", endSwipe);
document.addEventListener("pointercancel", () => { if (swipe && !swipe.on) swipe = null; else endSwipe(); });

  if (ds.acum) return toggleAcum(ds.acum);
  if (ds.sugfijo) return fromSugerencia(ds.sugfijo);
  if (ds.nosug) return save(() => putAj({ noSug: [...aj().noSug, ds.nosug] }), "Vale, no te lo vuelvo a sugerir");
  if (ds.payfijo) return payFijo(ds.payfijo, ds.paymk);
  if (ds.fijo) return openFijoForm(ds.fijo);
  if (ds.meta) return openMetaForm(ds.meta);
  if (ds.aportar) return openAportar(ds.aportar);
  if (ds.acct) return openCuenta(ds.acct);
  if (ds.cat) return openCat(ds.cat);
  const act = ds.act;
  if (act === "newGasto") return openMovForm();
  if (act === "quick") return openQuick();
  if (act === "quickDay") return openQuick({ fecha: UI.day });
  if (act === "quickTicket") { openMovForm(); const p = $("#fPhoto"); if (p) p.click(); return; }
  if (act === "newFav") return openFavForm();
  if (act === "howToday") return openHowToday();
  if (act === "hideResumen") { Prefs.resumenVisto = addMonths(curMk(), -1); savePrefs(); return render(); }
  if (act === "resumenInf") { UI.mkInf = addMonths(curMk(), -1); Prefs.resumenVisto = UI.mkInf; savePrefs(); return go("informes"); }
  if (act === "revOk") { const ops = D().movs.filter(m => m.revisar && m.importe > 0).map(m => { const d = stripId(m); delete d.revisar; return { col: "movs", id: m.id, data: d }; }); if (ops.length) save(() => W().many(ops), "Revisado"); return; }
  if (act === "addFijo") return openFijoForm();
  if (act === "addMeta") return openMetaForm();
  if (act === "addAcct") return openCuenta();
  if (act === "addCat") return openCat();
  if (act === "saveBud") return saveBudgets();
  if (act === "export") return openExport();
  if (act === "backup") return backup();
  if (act === "restore") return restore();
  if (act === "importBank") return importBank();
  if (act === "demoStart") return startDemo();
  if (act === "syncCfg") return openSyncCfg();
  if (act === "gemCfg") return openGemCfg();
  if (act === "siriCfg") return openSiri();
  if (act === "badgeCfg") return badgeCfg();
  if (act === "lookCfg") return openLook();
  if (act === "syncNow") return Sync.run();
});
document.addEventListener("input", e => {
  if (e.target.closest("#sheet")) return;
  const t = e.target;
  // Al buscar solo se redibuja la lista, no la pantalla entera
  if (t.id === "qMovs") { UI.q = t.value; UI.day = ""; const b = $("#movsBody"); if (b) b.innerHTML = movsBody(); }
  else if (t.id === "qProd") { UI.qProd = t.value; const b = $("#prodBody"); if (b) b.innerHTML = prodBody(); }
  else if (t.dataset.bud) UI.budDraft[t.dataset.bud] = t.value;
});
const sheetEl = $("#sheet");
sheetEl.addEventListener("click", e => {
  if (e.target.closest("[data-close]")) return closeSheet();
  if (Sheet.onClick) Sheet.onClick(e);
});
sheetEl.addEventListener("input", e => { if (Sheet.onInput) Sheet.onInput(e); });
sheetEl.addEventListener("change", e => { if (Sheet.onChange) Sheet.onChange(e); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && !$("#sheet").hidden) closeSheet(); });

/* =========================================================
   Ajustes de sincronización y de Gemini
   ========================================================= */
const b64e = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
const b64d = s => decodeURIComponent(escape(atob(s.replace(/-/g, "+").replace(/_/g, "/"))));
const makeCode = () => "CC1." + b64e(JSON.stringify({ u: Cfg.url, k: Cfg.key, g: Cfg.gemini || "" }));
function readCode(txt) {
  const m = String(txt || "").trim().match(/CC1\.([A-Za-z0-9_-]+)/); if (!m) return null;
  try { const o = JSON.parse(b64d(m[1])); return o && o.u && o.k ? o : null; } catch (e) { return null; }
}
async function copyText(t) {
  try { await navigator.clipboard.writeText(t); toast("Copiado"); }
  catch (e) { toast("No se pudo copiar. Mantén pulsado el código y cópialo a mano."); }
}
function queueAllLocal() {
  for (const col of Object.keys(LD)) for (const [id, rec] of Object.entries(LD[col])) {
    if (!OUT.some(o => o.col === col && o.id === id)) OUT.push({ col, id, mod: rec.mod || Date.now(), del: false, data: rec });
  }
  persistLocal();
}
function openSyncCfg() {
  if (demoOn) { toast("Sal del ejemplo para configurar la sincronización."); return; }
  const S = { url: Cfg.url || "", key: Cfg.key || "", busy: false, err: "", gem: "" };
  const draw = () => {
    const st = $("#sheet").hidden ? 0 : $("#sheetBody").scrollTop;
    const b = `${S.err ? `<div class="note bad">${esc(S.err)}</div>` : ""}
      ${Cfg.url ? `<div class="panel" style="display:flex;flex-direction:column;gap:8px"><span>${Sync.state === "error" ? `<span class="pill bad">Error</span> ${esc(Sync.err)}` : `<span class="pill good">Conectada</span> Última sincronización ${esc(lastSyncText())}${OUT.length ? ` · ${OUT.length} cambios pendientes` : ""}`}</span>
        <div class="btns"><button type="button" class="btn small" data-k="now">Sincronizar ahora</button></div></div>` : `<p class="muted" style="margin:0">Pega la dirección de la aplicación web de tu hoja y la clave que aparece al principio del script. Los pasos están en la guía de instalación.</p>`}
      <label class="field"><span>Dirección del script</span><input class="inp" id="sUrl" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(S.url)}"></label>
      <label class="field"><span>Clave</span><input class="inp" id="sKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="La que pone CLAVE en el script" value="${esc(S.key)}"></label>
      <div class="field"><span>¿Ya lo configuraste en otro dispositivo?</span><textarea class="inp" id="sCode" placeholder="Pega aquí el código de configuración (empieza por CC1.)"></textarea></div>
      ${Cfg.url ? `<div class="field"><span>Código para tu otro dispositivo</span><div class="code">${esc(makeCode())}</div>
        <div class="btns"><button type="button" class="btn small" data-k="copy">Copiar código</button></div>
        <span class="small muted">Pégalo en la app del otro dispositivo para conectarlo sin escribir nada. ${Cfg.gemini ? "Incluye tu clave de Gemini. " : ""}No lo compartas con nadie.</span></div>
        <button type="button" class="link" data-k="off" style="align-self:flex-start;color:var(--bad)">Desconectar la hoja en este dispositivo</button>` : ""}`;
    const foot = `<button class="btn" data-close>Cerrar</button><button class="btn primary" data-k="save" ${S.busy ? "disabled" : ""}>${S.busy ? `<span class="spin"></span>Probando…` : "Probar y guardar"}</button>`;
    openSheet("Hoja de Google", b, foot, {
      onInput(e) {
        const t = e.target;
        if (t.id === "sUrl") S.url = t.value.trim();
        if (t.id === "sKey") S.key = t.value.trim();
        if (t.id === "sCode") { const o = readCode(t.value); if (o) { S.url = o.u; S.key = o.k; S.gem = o.g || ""; S.err = ""; draw(); toast("Código leído. Toca «Probar y guardar»."); } }
      },
      async onClick(e) {
        const t = e.target.closest("button"); if (!t) return;
        const k = t.dataset.k;
        if (k === "copy") return copyText(makeCode());
        if (k === "now") { await Sync.run(); return draw(); }
        if (k === "off") return armDelete(t, () => { delete Cfg.url; delete Cfg.key; saveCfg(); LS.set(K.sync, { since: 0 }); Sync.state = "idle"; closeSheet(); render(); toast("Hoja desconectada. Tus datos siguen en este dispositivo."); });
        if (k === "save" && !S.busy) {
          if (!/^https:\/\/script\.google(usercontent)?\.com\//.test(S.url)) { S.err = "La dirección tiene que empezar por https://script.google.com/"; return draw(); }
          if (!S.key) { S.err = "Escribe la clave del script."; return draw(); }
          S.busy = true; S.err = ""; draw();
          try {
            await callSheet({ action: "ping" }, { url: S.url, key: S.key });
            const changed = Cfg.url !== S.url;
            Cfg.url = S.url; Cfg.key = S.key; if (S.gem) { Cfg.gemini = S.gem; delete Cfg.model; }
            saveCfg();
            if (changed) { LS.set(K.sync, { since: 0 }); queueAllLocal(); }
            closeSheet(); render(); toast("Hoja conectada. Sincronizando…");
            Sync.run();
          } catch (err) { S.busy = false; S.err = SYNC_ERR[err && err.code] || SYNC_ERR.red; draw(); }
        }
      },
    });
    $("#sheetBody").scrollTop = st;
  };
  draw();
}
function openGemCfg() {
  const S = { key: Cfg.gemini || "", busy: false, err: "" };
  const draw = () => openSheet("Leer tickets con Gemini", `${S.err ? `<div class="note bad">${esc(S.err)}</div>` : ""}
      <p class="muted" style="margin:0">Gemini es la IA de Google. Con una clave gratuita, la app lee los productos y precios de la foto del ticket. Consíguela en <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a> con tu cuenta de Google.</p>
      <label class="field"><span>Clave de Gemini</span><input class="inp" id="gKey" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="AIza…" value="${esc(S.key)}"></label>
      <p class="note" style="margin:0">Con la clave gratuita, Google puede usar las fotos que envíes para mejorar sus modelos. Un ticket de súper no suele tener datos sensibles, pero evita fotografiar documentos con tu nombre, DNI o datos bancarios.</p>
      ${Cfg.gemini ? `<button type="button" class="link" data-k="off" style="align-self:flex-start;color:var(--bad)">Quitar la clave de este dispositivo</button>` : ""}`,
    `<button class="btn" data-close>Cerrar</button><button class="btn primary" data-k="save" ${S.busy ? "disabled" : ""}>${S.busy ? `<span class="spin"></span>Probando…` : "Probar y guardar"}</button>`, {
      onInput(e) { if (e.target.id === "gKey") S.key = e.target.value.trim(); },
      async onClick(e) {
        const t = e.target.closest("button"); if (!t) return;
        if (t.dataset.k === "off") return armDelete(t, () => { delete Cfg.gemini; delete Cfg.model; saveCfg(); closeSheet(); render(); });
        if (t.dataset.k === "save" && !S.busy) {
          if (!S.key) { S.err = "Pega tu clave de Gemini."; return draw(); }
          S.busy = true; S.err = ""; draw();
          try {
            const list = await geminiModels(S.key);
            if (!list.length) throw { code: "nomodel" };
            Cfg.gemini = S.key; delete Cfg.model; saveCfg();
            closeSheet(); render(); toast("Lectura de tickets activada");
          } catch (err) {
            S.busy = false;
            S.err = err && err.code === "key" ? "Google no acepta esa clave. Cópiala de nuevo desde AI Studio." : err && err.code === "nomodel" ? "Tu clave funciona, pero no tiene ningún modelo Flash disponible." : "No se pudo comprobar la clave. Revisa tu conexión.";
            draw();
          }
        }
      },
    });
  draw();
}

/* =========================================================
   Arranque
   ========================================================= */
function init() {
  applyTheme();
  backend = localBackend(); mode = "local";
  backend.subscribe();
  render();
  handleLaunch();   // ?nuevo=gasto, ?texto=3,50 café… (atajos del icono en Android y enlaces)
  Sync.run();
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") Sync.soon(200); });
  window.addEventListener("online", () => Sync.soon(200));
  window.addEventListener("offline", updateStatus);
  setInterval(() => { if (document.visibilityState === "visible" && !Sync.running) Sync.run(); }, 60000);
  try { navigator.storage && navigator.storage.persist && navigator.storage.persist(); } catch (e) {}
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
}
init();
</script>
