<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cuentas Claras</title>
<meta name="description" content="Tus compras producto a producto, ingresos, pagos fijos, presupuestos y ahorro.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EDF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1116" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app de una columna en el móvil con barra inferior fija; en escritorio, barra lateral y columna de lectura de 880px.
   Lo llamativo es una sola cosa: la tarjeta de saldo en tinta azul. Los tickets se ven como papel térmico. */
:root{
  --bg:#EDF0F4; --surface:#FFFFFF; --surface-2:#F4F6F9; --paper:#FFFEF9; --line:#D9DFE7; --line-2:#C3CBD6;
  --fg:#131821; --muted:#586272; --faint:#8790A0;
  --accent:#2341C0; --accent-ink:#1A2F8C; --accent-fg:#FFFFFF; --accent-soft:#E1E6FA;
  --good:#16774A; --good-soft:#DBF0E3; --warn:#975800; --warn-soft:#FAEACC; --bad:#BC2E27; --bad-soft:#F9DFDC;
  --shadow:0 1px 2px rgba(19,24,33,.06),0 10px 28px rgba(19,24,33,.07);
  --scrim:rgba(14,18,24,.42);
  --c0:#3A6BD6; --c1:#DB6227; --c2:#2C9757; --c3:#A443BF; --c4:#C99817; --c5:#1598AE; --c6:#D13169; --c7:#6A788E; --c8:#8A673A; --c9:#5956D3;
  --f-display:'Bricolage Grotesque','Figtree',system-ui,sans-serif;
  --f-body:'Figtree',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px; --nav-h:68px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1116; --surface:#151A21; --surface-2:#1B2129; --paper:#1D232C; --line:#29313C; --line-2:#3A4452;
    --fg:#E6EAF0; --muted:#9AA4B1; --faint:#6E7887;
    --accent:#7F95FF; --accent-ink:#1F2E73; --accent-fg:#0D1116; --accent-soft:#222B4C;
    --good:#4DC48B; --good-soft:#15301F; --warn:#E5A43C; --warn-soft:#382A11; --bad:#FF746B; --bad-soft:#3B1917;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
    --scrim:rgba(0,0,0,.6);
    --c0:#6F96F0; --c1:#F08955; --c2:#58C280; --c3:#C67CDC; --c4:#E4BD4C; --c5:#4AC2D4; --c6:#EE6B98; --c7:#9BA8BA; --c8:#BC976B; --c9:#8F8CF1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1116; --surface:#151A21; --surface-2:#1B2129; --paper:#1D232C; --line:#29313C; --line-2:#3A4452;
  --fg:#E6EAF0; --muted:#9AA4B1; --faint:#6E7887;
  --accent:#7F95FF; --accent-ink:#1F2E73; --accent-fg:#0D1116; --accent-soft:#222B4C;
  --good:#4DC48B; --good-soft:#15301F; --warn:#E5A43C; --warn-soft:#382A11; --bad:#FF746B; --bad-soft:#3B1917;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.35);
  --scrim:rgba(0,0,0,.6);
  --c0:#6F96F0; --c1:#F08955; --c2:#58C280; --c3:#C67CDC; --c4:#E4BD4C; --c5:#4AC2D4; --c6:#EE6B98; --c7:#9BA8BA; --c8:#BC976B; --c9:#8F8CF1;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{color-scheme:light}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
body{margin:0;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.15;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.08rem;font-weight:700}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:.86rem}
.label{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}

/* ---------- estructura ---------- */
.app{min-height:100%;display:block}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(5,1fr);align-items:center;
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.nav .brand{display:none}
.nav-btn{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;color:var(--muted);font-size:.7rem;font-weight:600;border-radius:10px}
.nav-btn svg{width:22px;height:22px}
.nav-btn[aria-current="page"]{color:var(--accent)}
.nav-add{justify-self:center;width:54px;height:54px;border-radius:18px;border:0;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;box-shadow:var(--shadow);margin-top:-22px}
.nav-add svg{width:26px;height:26px}
.nav-add span{display:none}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px));max-width:880px;margin:0 auto}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.topbar h1{font-size:1.5rem;font-weight:800}
.topbar .app-name{font-family:var(--f-display);font-weight:700;font-size:.8rem;color:var(--accent);letter-spacing:.02em;display:block}
.status{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:600;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 10px;border-radius:999px;white-space:nowrap}
.status i{width:7px;height:7px;border-radius:50%;background:var(--faint)}
.status[data-s="nube"] i{background:var(--good)}
.status[data-s="local"] i{background:var(--warn)}
.status[data-s="demo"] i{background:var(--accent)}
.view{display:flex;flex-direction:column;gap:22px}
.demo-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border:1px solid var(--accent);color:var(--fg);border-radius:var(--r-sm);padding:10px 14px;margin-bottom:14px;font-size:.9rem}

@media (min-width:900px){
  .app{display:grid;grid-template-columns:236px 1fr}
  .nav{position:sticky;top:0;height:100vh;bottom:auto;right:auto;border-top:0;border-right:1px solid var(--line);
    display:flex;flex-direction:column;align-items:stretch;gap:4px;padding:22px 14px}
  .nav .brand{display:block;font-family:var(--f-display);font-weight:800;font-size:1.25rem;padding:4px 10px 18px;color:var(--fg)}
  .nav .brand small{display:block;font-family:var(--f-body);font-weight:500;font-size:.78rem;color:var(--muted)}
  .nav-btn{flex-direction:row;gap:12px;font-size:.95rem;padding:10px 12px;justify-content:flex-start}
  .nav-btn[aria-current="page"]{background:var(--accent-soft)}
  .nav-add{order:-1;width:100%;height:auto;margin:0 0 14px;border-radius:12px;padding:11px 14px;display:flex;gap:8px;justify-content:center;font-weight:700;box-shadow:none}
  .nav-add span{display:inline}
  .nav-add svg{width:20px;height:20px}
  main{padding-block:0 48px;width:100%}
  .topbar{padding-block:26px 14px}
  .topbar .app-name{display:none}
}

/* ---------- piezas ---------- */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.link{background:none;border:0;color:var(--accent);font-weight:600;font-size:.88rem;padding:4px 0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.panel.flush{padding:4px 0}
.hero{background:var(--accent-ink);color:#F3F5FF;border-radius:18px;padding:20px 20px 18px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;border:28px solid rgba(255,255,255,.06)}
.hero .label{color:rgba(243,245,255,.72)}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.1rem,9vw,2.9rem);line-height:1;letter-spacing:-.02em}
.hero .accts{display:flex;flex-wrap:wrap;gap:8px}
.hero .acct{background:rgba(255,255,255,.1);border-radius:999px;padding:5px 12px;font-size:.84rem}
.hero .acct b{font-weight:600}
.hero .sub{font-size:.84rem;color:rgba(243,245,255,.78)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:1.12rem;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v.good{color:var(--good)} .stat .v.bad{color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;position:relative}
.bar > i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.warn > i{background:var(--warn)} .bar.bad > i{background:var(--bad)}
.dot{width:10px;height:10px;border-radius:50%;flex:none;display:inline-block}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;white-space:nowrap;letter-spacing:.01em}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.info{background:var(--accent-soft);color:var(--accent)} .pill.mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:12px;padding:11px 16px;background:none;border:0;border-top:1px solid var(--line);text-align:left;width:100%}
.list > .row:first-child{border-top:0}
button.row:hover{background:var(--surface-2)}
.row .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:.8rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .a{font-family:var(--f-mono);font-weight:500;font-size:.92rem;text-align:right;white-space:nowrap}
.a.in{color:var(--good)}
.day-h{display:flex;justify-content:space-between;gap:10px;padding:14px 4px 6px;font-size:.8rem;font-weight:600;color:var(--muted)}
.day-h:first-letter{text-transform:uppercase}
.alert{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 0;border-top:1px solid var(--line)}
.alert:first-child{border-top:0;padding-top:2px}
.alert .bar{grid-column:1/-1}
.empty{display:flex;flex-direction:column;gap:12px;align-items:flex-start;padding:18px;border:1.5px dashed var(--line-2);border-radius:var(--r);background:var(--surface)}
.empty p{margin:0;color:var(--muted);max-width:52ch}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.steps b{color:var(--fg);font-weight:600}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border-radius:11px;border:1px solid var(--line-2);background:var(--surface);padding:9px 14px;font-weight:600;font-size:.92rem;line-height:1.2;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn svg{width:18px;height:18px;flex:none}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger.armed{background:var(--bad);color:var(--surface)}
.btn.small{padding:6px 10px;font-size:.82rem;border-radius:9px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.month-sw{display:flex;align-items:center;gap:6px}
.month-sw b{font-family:var(--f-display);font-weight:700;font-size:1.05rem;min-width:9.5em;text-align:center}
.month-sw b::first-letter{text-transform:uppercase}
.icon-btn{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px}
.sec > .search{flex:none}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.search{flex:1 1 200px;min-width:0;padding:10px 12px;border-radius:11px;border:1px solid var(--line);background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:.86rem;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);font-weight:600}
.chip .pr{font-family:var(--f-mono);font-size:.76rem;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:3px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 6px;font-weight:600;font-size:.9rem;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field > span{font-size:.8rem;font-weight:600;color:var(--muted)}
.inp{width:100%;min-width:0;padding:10px 12px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface)}
.inp:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.inp.big{font-family:var(--f-display);font-size:1.9rem;font-weight:700;padding:8px 12px;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{font-size:.84rem;padding:9px 12px;border-radius:10px;background:var(--surface-2);border:1px solid var(--line);color:var(--muted)}
.note.warn{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.note.bad{background:var(--bad-soft);border-color:transparent;color:var(--bad)}

/* ---------- hoja inferior ---------- */
.sheet-wrap{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:620px;max-height:calc(100% - 24px - env(safe-area-inset-top,0px));background:var(--bg);border-radius:20px 20px 0 0;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sheet-h h2{font-size:1.15rem}
.sheet-b{overflow-y:auto;padding:16px max(16px,env(safe-area-inset-right,0px)) 18px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:16px}
.sheet-f{display:flex;gap:10px;justify-content:flex-end;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:1px solid var(--line);background:var(--surface)}
.sheet-f .btn{flex:1 1 0}
@media (min-width:700px){.sheet-wrap{align-items:center}.sheet{border-radius:20px;max-height:88vh}.sheet-f{border-radius:0 0 20px 20px}.sheet-f .btn{flex:0 0 auto;min-width:120px}}

/* productos dentro del formulario */
.items{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:minmax(0,1fr) 64px 84px auto;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px}
.item .inp{padding:8px 9px;font-size:.92rem}
.item .nm{grid-column:1/-1}
.item .tot{font-family:var(--f-mono);font-size:.9rem;text-align:right;min-width:4.5em}
.item .x{width:32px;height:32px;border-radius:8px;border:0;background:none;color:var(--faint);display:grid;place-items:center}
.item .x:hover{color:var(--bad);background:var(--bad-soft)}
.item select.inp{grid-column:1/-1;font-size:.82rem;padding:6px 8px;color:var(--muted)}
.items-sum{display:flex;justify-content:space-between;font-weight:600;padding:2px 4px}
.reading{display:flex;align-items:center;gap:10px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--accent-soft);border-top-color:var(--accent);animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:3s}}

/* ticket en papel térmico */
.ticket{background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:18px 16px 22px;font-family:var(--f-mono);font-size:.86rem;line-height:1.55;position:relative;
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 50% 100%/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 50% 100%/14px 100% repeat-x}
.ticket .tc{text-align:center}
.ticket .store{font-weight:600;font-size:1rem;letter-spacing:.06em;text-transform:uppercase}
.ticket hr{border:0;border-top:1.5px dashed var(--line-2);margin:10px 0}
.ticket .ln{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px}
.ticket .ln .q{color:var(--muted);font-size:.8rem}
.ticket .tot{font-weight:600;font-size:1.05rem}

/* tablas */
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:.9rem}
.tbl th{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right;font-family:var(--f-mono);font-size:.86rem;white-space:nowrap}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--surface-2)}

/* gráficos */
.cat-rows{display:flex;flex-direction:column;gap:12px}
.cat-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;align-items:baseline}
.cat-row .nm{display:flex;align-items:center;gap:8px;font-weight:600;min-width:0}
.cat-row .nm span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cat-row .vv{font-family:var(--f-mono);font-size:.86rem;white-space:nowrap}
.cat-row .track{grid-column:1/-1;height:10px;border-radius:99px;background:var(--surface-2);position:relative}
.cat-row .track i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.cat-row .track b{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--fg);border-radius:2px}

<script>
"use strict";
/* =========================================================
   Utilidades
   ========================================================= */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const EUR = new Intl.NumberFormat("es-ES", { style: "currency", currency: "EUR" });
const r2 = n => Math.round((+n || 0) * 100) / 100;
const fmt = n => EUR.format(r2(n));
const fmtN = (n, d = 2) => new Intl.NumberFormat("es-ES", { minimumFractionDigits: 0, maximumFractionDigits: d }).format(+n || 0);
function parseNum(v) {
  if (typeof v === "number") return v;
  v = String(v ?? "").trim().replace(/[\s€]/g, "");
  if (!v) return NaN;
  if (v.includes(",")) v = v.replace(/\./g, "").replace(",", ".");
  return parseFloat(v);
}
const inpNum = n => (n === "" || n == null || isNaN(n)) ? "" : String(r2(n)).replace(".", ",");
const pad = n => String(n).padStart(2, "0");
const todayStr = () => { const d = new Date(); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const curMk = () => todayStr().slice(0, 7);
function addMonths(mk, n) { let [y, m] = mk.split("-").map(Number); m += n; while (m > 12) { m -= 12; y++; } while (m < 1) { m += 12; y--; } return `${y}-${pad(m)}`; }
const MESES = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto", "septiembre", "octubre", "noviembre", "diciembre"];
const monthLabel = mk => { const [y, m] = mk.split("-"); return `${MESES[+m - 1]} ${y}`; };
const monthShort = mk => MESES[+mk.slice(5) - 1].slice(0, 3);
const daysIn = mk => { const [y, m] = mk.split("-").map(Number); return new Date(y, m, 0).getDate(); };
const dayLabel = s => new Date(s + "T12:00").toLocaleDateString("es-ES", { weekday: "long", day: "numeric", month: "long" });
const dateShort = s => new Date(s + "T12:00").toLocaleDateString("es-ES", { day: "numeric", month: "short" });
const validDate = s => /^\d{4}-\d{2}-\d{2}$/.test(s || "") && !isNaN(new Date(s + "T12:00"));
const uid = () => (Date.now().toString(36) + Math.random().toString(36).slice(2, 10));
const norm = s => String(s || "").trim().toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ");
const clone = o => JSON.parse(JSON.stringify(o));
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const plural = (n, a, b) => `${fmtN(n, 3)} ${n === 1 ? a : b}`;
// Las cantidades (kilos, unidades) admiten 3 decimales: 0,345 kg no se redondea a 0,35
const inpQ = n => (n === "" || n == null || isNaN(n)) ? "" : String(Math.round(n * 1000) / 1000).replace(".", ",");
const addDays = (s, n) => { const d = new Date(s + "T12:00"); d.setDate(d.getDate() + n); return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`; };
const vibrate = () => { try { navigator.vibrate && navigator.vibrate(12); } catch (e) {} };
const median = arr => { const a = [...arr].sort((x, y) => x - y); const n = a.length; return n ? (n % 2 ? a[(n - 1) / 2] : (a[n / 2 - 1] + a[n / 2]) / 2) : 0; };
const tagsOf = m => Array.isArray(m.tags) ? m.tags : [];

/* =========================================================
   Configuración por defecto
   ========================================================= */
const DEFAULTS = {
  cats: [
    { id: "super", n: "Supermercado", c: 0, p: 0 },
    { id: "comer", n: "Comer fuera", c: 1, p: 0 },
    { id: "transp", n: "Transporte", c: 5, p: 0 },
    { id: "casa", n: "Casa y facturas", c: 8, p: 0 },
    { id: "subs", n: "Suscripciones", c: 9, p: 0 },
    { id: "ocio", n: "Ocio", c: 3, p: 0 },
    { id: "ropa", n: "Ropa", c: 6, p: 0 },
    { id: "salud", n: "Salud e higiene", c: 2, p: 0 },
    { id: "estudios", n: "Estudios", c: 4, p: 0 },
    { id: "otros", n: "Otros gastos", c: 7, p: 0 },
  ],
  catsIng: [
    { id: "trabajo", n: "Trabajo", c: 2 },
    { id: "beca", n: "Beca", c: 0 },
    { id: "familia", n: "Familia", c: 3 },
    { id: "ventas", n: "Ventas", c: 4 },
    { id: "otros-ing", n: "Otros ingresos", c: 7 },
  ],
  cuentas: [{ id: "banco", n: "Banco", ini: 0 }, { id: "efectivo", n: "Efectivo", ini: 0 }],
};
const METODOS = [{ id: "tarjeta", n: "Tarjeta", cuenta: "banco" }, { id: "efectivo", n: "Efectivo", cuenta: "efectivo" }, { id: "bizum", n: "Bizum", cuenta: "banco" }];
const FREQS = { mensual: "Cada mes", trimestral: "Cada 3 meses", anual: "Cada año" };

/* =========================================================
   Estado y almacenamiento
   ========================================================= */
const mkStore = () => ({ movs: [], fijos: [], metas: [], ajDoc: null, loaded: { movs: false, fijos: false, metas: false, aj: false } });
const Real = mkStore();
let Demo = null, demoOn = false;
const D = () => demoOn ? Demo : Real;
let backend = null;          // datos reales: en este dispositivo + sincronización con la hoja de Google
let mode = "loading";
const LS = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } },
};
const K = { data: "cc-datos-v1", out: "cc-pendientes-v1", cfg: "cc-config-v1", sync: "cc-sync-v1" };
let Cfg = LS.get(K.cfg, {});          // { url, key, gemini, model }
const saveCfg = () => LS.set(K.cfg, Cfg);
const canTicket = () => !!Cfg.gemini;
// Preferencias de este dispositivo (tema, color, vista…): no se sincronizan
const PK = "cc-prefs-v1";
let Prefs = Object.assign({ theme: "auto", accent: "azul", movView: "lista", resumenVisto: "" }, LS.get(PK, {}));
const savePrefs = () => LS.set(PK, Prefs);
const UI = { view: "inicio", mkMovs: curMk(), mkInf: curMk(), q: "", qAll: false, fTipo: "todo", qProd: "", budDraft: {}, iniDraft: {}, day: "" };

function aj() {
  const d = D().ajDoc || {};
  return {
    cats: d.cats?.length ? d.cats : DEFAULTS.cats,
    catsIng: d.catsIng?.length ? d.catsIng : DEFAULTS.catsIng,
    cuentas: d.cuentas?.length ? d.cuentas : DEFAULTS.cuentas,
    favs: Array.isArray(d.favs) ? d.favs : [],      // favoritos para apuntar en un toque
    noSug: Array.isArray(d.noSug) ? d.noSug : [],   // sugerencias de pago fijo descartadas
  };
}
const allLoaded = () => demoOn || Object.values(Real.loaded).every(Boolean);
const sortMovs = arr => arr.sort((a, b) => (b.fecha || "").localeCompare(a.fecha || "") || (b.creado || 0) - (a.creado || 0));

/* ---------- Datos en este dispositivo ---------- */
let LD = LS.get(K.data, null) || { movs: {}, fijos: {}, metas: {}, ajustes: {} };
for (const c of ["movs", "fijos", "metas", "ajustes"]) LD[c] = LD[c] || {};
let OUT = LS.get(K.out, []);   // cambios pendientes de subir a la hoja
function persistLocal() {
  if (!LS.set(K.data, LD) || !LS.set(K.out, OUT)) toast("No queda espacio en este dispositivo para guardar. Sincroniza y exporta tus datos.");
}
function localBackend() {
  const toArr = col => Object.entries(LD[col]).map(([id, v]) => ({ id, ...clone(v) }));
  const refresh = () => {
    Real.movs = sortMovs(toArr("movs"));
    Real.fijos = toArr("fijos").sort((a, b) => (a.creado || 0) - (b.creado || 0));
    Real.metas = toArr("metas").sort((a, b) => (a.creado || 0) - (b.creado || 0));
    Real.ajDoc = LD.ajustes.general ? clone(LD.ajustes.general) : null;
    Real.loaded = { movs: true, fijos: true, metas: true, aj: true };
    scheduleRender();
    if (Real.movs.some(m => m.rapido && !m.procesado)) setTimeout(procesarRapidos, 0);
  };
  const apply = (col, id, data, del) => {
    const mod = Date.now();
    const rec = del ? null : { ...clone(data), mod };
    if (del) delete LD[col][id]; else LD[col][id] = rec;
    OUT = OUT.filter(o => !(o.col === col && o.id === id));
    OUT.push({ col, id, mod, del: !!del, data: rec });
  };
  const change = (col, id, data, del) => { apply(col, id, data, del); persistLocal(); refresh(); Sync.soon(); };
  return {
    put: async (col, id, data) => change(col, id, data, false),
    del: async (col, id) => change(col, id, null, true),
    putAj: async data => change("ajustes", "general", data, false),
    // Muchos cambios de golpe (importar, restaurar, borrar una categoría): se guarda una sola vez
    many: async ops => { for (const o of ops) apply(o.col, o.id, o.data, o.del); persistLocal(); refresh(); Sync.soon(); },
    subscribe: refresh, refresh,
  };
}

/* ---------- Sincronización con la hoja de Google ---------- */
const SYNC_ERR = {
  clave: "La clave no coincide con la del script de tu hoja.",
  respuesta: "Tu hoja no responde como se esperaba. Revisa que el script esté implementado como aplicación web con acceso para «Cualquier usuario».",
  red: "No se pudo conectar con tu hoja. Revisa tu conexión a internet y la dirección del script.",
  ocupado: "Tu hoja estaba ocupada. Se volverá a intentar enseguida.",
  servidor: "El script de tu hoja ha dado un error. Revisa que hayas copiado el código completo.",
};
async function callSheet(body, cfg = Cfg) {
  let r;
  try {
    r = await fetch(cfg.url, { method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" }, body: JSON.stringify({ ...body, key: cfg.key }), redirect: "follow" });
  } catch (e) { throw { code: "red" }; }
  if (!r.ok) throw { code: r.status === 404 ? "respuesta" : "red" };
  let j; try { j = await r.json(); } catch (e) { throw { code: "respuesta" }; }
  if (!j || !j.ok) throw { code: (j && j.error) || "servidor" };
  return j;
}
const Sync = {
  state: "idle", err: "", timer: null, running: false,
  soon(ms = 1500) { clearTimeout(this.timer); this.timer = setTimeout(() => this.run(), ms); },
  async run() {
    if (!Cfg.url || !Cfg.key || this.running || demoOn) { updateStatus(); return; }
    if (!navigator.onLine) { this.state = "offline"; updateStatus(); return; }
    this.running = true; this.state = "sync"; updateStatus();
    const sent = OUT.slice(0, 150);
    const meta = LS.get(K.sync, { since: 0 });

const movRow = m => `<div class="sw-wrap" data-swipe="${esc(m.id)}"><div class="sw-bg" aria-hidden="true"><span class="r1">Repetir</span><span class="r2">Borrar</span></div><button class="row" data-mov="${esc(m.id)}">${movDot(m)}<span style="min-width:0"><span class="t" style="display:block">${esc(movTitle(m))}${m.revisar ? ` <span class="pill warn">Revisar</span>` : ""}</span><span class="s" style="display:block">${esc(movSub(m))}</span></span>${movAmt(m)}</button></div>`;

/* =========================================================
   Render general
   ========================================================= */
const TITLES = { inicio: "Inicio", movs: "Movimientos", informes: "Informes", plan: "Plan" };
let renderQueued = false;
function scheduleRender() { if (renderQueued) return; renderQueued = true; requestAnimationFrame(() => { renderQueued = false; render(); }); }
function render() {
  const ae = document.activeElement, aeId = ae && ae.id && ae.closest("main") ? ae.id : null;
  let selS = null, selE = null; try { if (aeId) { selS = ae.selectionStart; selE = ae.selectionEnd; } } catch (e) {}
  $("#viewTitle").textContent = TITLES[UI.view];
  for (const b of $$(".nav-btn")) b.toggleAttribute("aria-current", false), b.dataset.view === UI.view && b.setAttribute("aria-current", "page");
  for (const v of Object.keys(TITLES)) $("#view-" + v).hidden = v !== UI.view;
  $("#demoBanner").hidden = !demoOn;
  setMode(mode);
  const el = $("#view-" + UI.view);
  el.innerHTML = !allLoaded() ? loadingHtml() : VIEWS[UI.view]();
  if (aeId) { const n = document.getElementById(aeId); if (n) { n.focus(); try { if (selS != null) n.setSelectionRange(selS, selE); } catch (e) {} } }
  if (UI.view === "informes") drawCharts();
  updateBadge();
}
// Número en el icono de la app: pagos que vencen hoy o ya vencieron + lo que hay por revisar
function updateBadge() {
  if (demoOn || !allLoaded() || !("setAppBadge" in navigator)) return;
  try {
    const n = fijosMes(curMk()).filter(f => f.est === "vencido" || f.est === "hoy").length + fijosAtrasados().length + Real.movs.filter(m => m.revisar).length;
    (n ? navigator.setAppBadge(n) : navigator.clearAppBadge()).catch(() => {});
  } catch (e) {}
}
const loadingHtml = () => `<div class="panel" aria-busy="true" style="display:flex;flex-direction:column;gap:12px"><div class="skel" style="width:40%"></div><div class="skel" style="width:70%;height:30px"></div><div class="skel" style="width:55%"></div><p class="muted small" style="margin:0">Cargando tus cuentas…</p></div>`;
function go(view) { UI.view = view; render(); window.scrollTo({ top: 0 }); }
const monthSwitch = (key, mk) => `<div class="month-sw"><button class="icon-btn" data-mprev="${key}" aria-label="Mes anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button><b>${esc(monthLabel(mk))}</b><button class="icon-btn" data-mnext="${key}" aria-label="Mes siguiente"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button></div>`;

/* =========================================================
   Vistas
   ========================================================= */
const ICON = {
  camera: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"><path d="M4 8.5h3l1.6-2.5h6.8L17 8.5h3v10.5H4z"/><circle cx="12" cy="13.5" r="3.4"/></svg>`,
  plus: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>`,
  dl: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4.5-4.5M12 15l4.5-4.5M5 19.5h14"/></svg>`,
};
function fijoPill(f) {
  if (f.est === "atrasado") return `<span class="pill bad">Del mes pasado, sin registrar</span>`;
  if (f.est === "pagado") return `<span class="pill good">${f.tipo === "ingreso" ? "Cobrado" : "Pagado"}</span>`;
  if (f.est === "vencido") return `<span class="pill bad">Venció hace ${-f.dias} ${f.dias === -1 ? "día" : "días"}</span>`;
  if (f.est === "hoy") return `<span class="pill warn">Vence hoy</span>`;
  if (f.est === "pronto") return `<span class="pill info">En ${f.dias} ${f.dias === 1 ? "día" : "días"}</span>`;
  return `<span class="pill mute">Día ${+f.fecha.slice(8)}</span>`;
}

const VIEWS = {
  inicio() {
    const d = D(), mk = curMk(), t = totals(mk), sal = saldos();
    const total = r2(Object.values(sal).reduce((a, b) => a + b, 0));
    const apartado = r2(d.metas.reduce((a, m) => a + (+m.aportado || 0), 0));
    const hi = hoyInfo();
    const sinSaldos = hi.modo === "saldo" && aj().cuentas.every(c => !+c.ini) && !demoOn;
    const big = sinSaldos && hi.base <= 0 ? `<div class="big num">—</div><div class="sub">Dime cuánto tienes ahora en el banco y en efectivo y te diré cuánto puedes gastar cada día.</div><button class="btn small" data-go="plan" style="align-self:flex-start;margin-top:6px;background:#fff;color:#1A2F8C;border-color:transparent">Ajustar saldos</button>`
      : hi.base <= 0 ? `<div class="big num">0 €</div><div class="sub">No te queda margen este mes${hi.modo === "presupuesto" ? " en tus presupuestos" : ""}.</div>`
      : hi.queda >= 0 ? `<div class="big num">${esc(fmt(hi.queda))}</div><div class="sub">${hi.gHoy > 0 ? `Llevas ${esc(fmt(hi.gHoy))} hoy · ` : ""}${esc(fmt(hi.porDia))} al día hasta fin de mes (${hi.daysLeft} ${hi.daysLeft === 1 ? "día" : "días"})</div>`
      : `<div class="big num neg">0 €</div><div class="sub">Hoy te has pasado ${esc(fmt(-hi.queda))} de tus ${esc(fmt(hi.porDia))} diarios. Mañana tendrás un poco menos.</div>`;
    let h = `<div class="hero"><div class="today"><div class="label">Puedes gastar hoy</div>${big}${sinSaldos && hi.base <= 0 ? "" : `<button class="how" data-act="howToday">¿Cómo se calcula?</button>`}</div>
      <div class="saldo"><span class="label">Saldo total</span><b class="num">${esc(fmt(total))}</b>${apartado > 0 ? `<span class="sub">· libre ${esc(fmt(total - apartado))}</span>` : ""}</div>
      <div class="accts">${aj().cuentas.map(c => `<span class="acct">${esc(c.n)} <b class="num">${esc(fmt(sal[c.id] || 0))}</b></span>`).join("")}</div></div>`;

    // Apuntar en un toque
    const favs = aj().favs, sug = sugeridos().slice(0, Math.max(0, 6 - favs.length));
    h += `<div class="sec"><div class="sec-h"><h2>Apuntar rápido</h2><button class="link" data-act="quick">Escribir o dictar</button></div>
      <div class="chips">${favs.map(f => `<button class="chip fav" data-fav="${esc(f.id)}"><span class="dot" style="background:${cvar(catById(f.cat).c)}"></span>${esc(f.n)} <span class="pr">${esc(fmt(f.importe))}</span></button>`).join("")}
      ${sug.map(s => `<button class="chip fav" data-sug="${esc(s.k)}"><span class="dot" style="background:${cvar(catById(s.cat).c)}"></span>${esc(s.n)} <span class="pr">${esc(fmt(s.importe))}</span></button>`).join("")}
      <button class="chip add-fav" data-act="newFav">${ICON.plus.replace('<svg', '<svg width="14" height="14"')}Favorito</button></div>
      <span class="small muted">${favs.length || sug.length ? "Un toque y queda apuntado con la fecha de hoy. Si te equivocas, toca «Deshacer»." : "Crea favoritos (café, bus, menú…) para apuntarlos con un solo toque."}</span></div>`;

    if (!demoOn && !Cfg.url) {
      h += `<div class="panel" style="display:flex;flex-direction:column;gap:10px;border-color:var(--warn)"><b>Tus datos solo están en este dispositivo</b>
        <p class="small muted" style="margin:0">Conecta tu hoja de Google para tener una copia segura, ver lo mismo en el iPhone y en el ordenador, y apuntar gastos con Siri.</p>
        <div class="btns"><button class="btn small primary" data-act="syncCfg">Conectar mi hoja</button></div></div>`;
    } else if (!demoOn && Sync.state === "error") {
      h += `<div class="note bad">${esc(Sync.err)} <button class="link" data-act="syncNow">Reintentar</button></div>`;
    }

    // Llegado por Siri o importado que conviene revisar
    const rev = d.movs.filter(m => m.revisar);
    if (rev.length) {
      h += `<div class="sec"><div class="sec-h"><h2>Para revisar</h2>${rev.length > 1 ? `<button class="link" data-act="revOk">Todo bien</button>` : ""}</div><div class="panel flush list">${rev.slice(0, 5).map(m => `<div class="row">
        ${movDot(m)}<span style="min-width:0"><span class="t" style="display:block">${m.importe > 0 ? esc(movTitle(m)) : "Sin importe"}</span><span class="s" style="display:block;white-space:normal">${m.texto ? `«${esc(m.texto)}» · ` : ""}${esc(catById(m.cat).n)}</span></span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:5px">${m.importe > 0 ? movAmt(m) : ""}<button class="btn small" data-rev="${esc(m.id)}">Revisar</button></span></div>`).join("")}</div></div>`;
    }

    if (!d.movs.length && !demoOn) {
      h += `<div class="empty"><h2>Empieza por aquí</h2>
        <ol class="steps">
          <li><b>Ajusta tus saldos.</b> Indica cuánto tienes ahora en el banco y en efectivo.</li>
          <li><b>Apunta tu primera compra</b>: escríbela tal cual («3,50 café») o con foto del ticket.</li>
          <li><b>Añade tus pagos fijos y tus presupuestos</b> para que la app te avise.</li>
        </ol>
        <div class="btns">
          <button class="btn primary" data-act="quick">${ICON.plus}Añadir gasto</button>
          ${canTicket() ? `<button class="btn" data-act="quickTicket">${ICON.camera}Leer un ticket</button>` : ""}
          <button class="btn" data-go="plan">Ajustar saldos</button>
          <button class="btn" data-act="demoStart">Ver un ejemplo</button>
        </div></div>`;
    }

    // Resumen del mes pasado, la primera semana del mes
    const prevMk = addMonths(mk, -1);
    if (+todayStr().slice(8) <= 7 && Prefs.resumenVisto !== prevMk && monthMovs(prevMk).length) {
      const rs = resumenMes(prevMk);
      if (rs.length) h += `<div class="sec"><div class="sec-h"><h2>Tu ${esc(MESES[+prevMk.slice(5) - 1])} en resumen</h2><button class="link" data-act="hideResumen">Cerrar</button></div>
        <div class="panel"><ul class="ins">${rs.map(r => `<li><span class="ic">${esc(r.ic)}</span><span>${esc(r.t)}</span></li>`).join("")}</ul>
        <div class="btns" style="margin-top:12px"><button class="btn small" data-act="resumenInf">Ver el informe</button></div></div></div>`;
    }

    h += `<div class="sec"><div class="sec-h"><h2>${esc(cap(monthLabel(mk)))}</h2><button class="link" data-go="informes">Ver informe</button></div>
      <div class="stats">
        <div class="stat"><span class="label">Ingresos</span><span class="v good">${esc(fmt(t.ing))}</span></div>
        <div class="stat"><span class="label">Gastos</span><span class="v">${esc(fmt(t.gas))}</span></div>
        <div class="stat"><span class="label">Balance</span><span class="v ${t.bal < 0 ? "bad" : "good"}">${esc(fmt(t.bal))}</span></div>
      </div></div>`;

    // Presupuesto
    const bcats = aj().cats.filter(c => +c.p > 0);
    let bud = `<div class="sec"><div class="sec-h"><h2>Presupuesto del mes</h2><button class="link" data-go="plan">Editar</button></div>`;
    if (!bcats.length) {
      bud += `<div class="panel"><p class="muted" style="margin:0 0 10px">Pon un límite mensual a tus categorías y te avisaré cuando te acerques.</p><button class="btn small" data-go="plan">Poner presupuestos</button></div>`;
    } else {
      const sp = catSpend(mk);
      const totP = r2(bcats.reduce((a, c) => a + limite(c, mk), 0));
      const totG = r2(bcats.reduce((a, c) => a + (sp[c.id] || 0), 0));
      const pct = totP > 0 ? totG / totP : 1, left = r2(totP - totG);
      const alerts = budgetAlerts(mk);
      bud += `<div class="panel" style="display:flex;flex-direction:column;gap:10px">
        <div style="display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap"><span><b class="num">${esc(fmt(totG))}</b> <span class="muted">de ${esc(fmt(totP))}</span></span>
        <span class="small ${left < 0 ? "" : "muted"}">${left >= 0 ? `Te quedan ${esc(fmt(left))}` : `<span class="pill bad">Te has pasado ${esc(fmt(-left))}</span>`}</span></div>
        <div class="bar ${pct >= 1 ? "bad" : pct >= 0.8 ? "warn" : ""}"><i style="width:${Math.min(100, pct * 100).toFixed(1)}%"></i></div>
        ${alerts.length ? `<div style="margin-top:6px">${alerts.map(a => `<div class="alert"><span style="display:flex;align-items:center;gap:8px;font-weight:600;min-width:0"><span class="dot" style="background:${cvar(a.c.c)}"></span>${esc(a.c.n)}</span>
          ${a.pct >= 1 ? `<span class="pill bad">Pasado ${esc(fmt(a.g - a.L))}</span>` : `<span class="pill warn">${Math.round(a.pct * 100)} %</span>`}
          <div class="bar ${a.pct >= 1 ? "bad" : "warn"}"><i style="width:${Math.min(100, a.pct * 100).toFixed(1)}%"></i></div>
          <span class="small muted num" style="grid-column:1/-1">${esc(fmt(a.g))} de ${esc(fmt(a.L))}${a.L !== +a.c.p ? ` (incluye lo acumulado)` : ""}</span></div>`).join("")}</div>`
          : `<p class="small muted" style="margin:0">Todas tus categorías van por debajo del 80 % de su límite.</p>`}
      </div>`;
    }
    bud += `</div>`;

    // Pagos fijos (los del mes y los del mes pasado sin registrar)
    const fm = [...fijosAtrasados(), ...fijosMes(mk)];
    let fij = `<div class="sec"><div class="sec-h"><h2>Pagos fijos de ${esc(MESES[+mk.slice(5) - 1])}</h2><button class="link" data-go="plan">Gestionar</button></div>`;
    if (!fm.length) {
      fij += `<div class="panel"><p class="muted" style="margin:0 0 10px">${d.fijos.length ? "Este mes no tienes pagos fijos." : "Añade el alquiler, el móvil, tus suscripciones o la beca y te recordaré cuándo toca."}</p>${d.fijos.length ? "" : `<button class="btn small" data-act="addFijo">Añadir pago fijo</button>`}</div>`;
    } else {
      fij += `<div class="panel flush list">${fm.map(f => `<div class="row">
        <span class="dot" style="background:${cvar(catById(f.cat).c)}"></span>
        <span style="min-width:0;display:flex;flex-direction:column;gap:3px"><span class="t">${esc(f.n)}</span><span>${fijoPill(f)}</span></span>
        <span style="display:flex;flex-direction:column;align-items:flex-end;gap:5px"><span class="a ${f.tipo === "ingreso" ? "in" : ""}">${f.tipo === "ingreso" ? "+" : ""}${esc(fmt(f.importe))}</span>${f.pagado ? "" : `<button class="btn small" data-payfijo="${esc(f.id)}" data-paymk="${esc(f.fecha.slice(0, 7))}">${f.tipo === "ingreso" ? "Registrar cobro" : "Registrar pago"}</button>`}</span>
      </div>`).join("")}</div>`;
    }
    const nSug = sugerenciasFijos().length;
    if (nSug) fij += `<button class="link" data-go="plan" style="align-self:flex-start">${nSug === 1 ? "Hay 1 gasto que se repite cada mes" : `Hay ${nSug} gastos que se repiten cada mes`}. ¿Los añado como pagos fijos?</button>`;
    fij += `</div>`;

    // Te deben
    const dd = deudas();
    let deb = "";
    if (dd.length) {
      deb = `<div class="sec"><div class="sec-h"><h2>Te deben</h2><span class="small muted num">${esc(fmt(dd.reduce((a, x) => a + x.t, 0)))}</span></div><div class="panel flush list">${dd.map(x => `<button class="row" data-debe="${esc(x.k)}"><span class="dot" style="background:var(--good)"></span>
        <span style="min-width:0"><span class="t" style="display:block">${esc(x.n)}</span><span class="s" style="display:block">${plural(x.items.length, "gasto", "gastos")} a medias</span></span><span class="a in">${esc(fmt(x.t))}</span></button>`).join("")}</div></div>`;
    }

    // Últimos movimientos
    const last = d.movs.slice(0, 6);
    let ult = `<div class="sec"><div class="sec-h"><h2>Últimos movimientos</h2><button class="link" data-go="movs">Ver todos</button></div>`;
    ult += last.length ? `<div class="panel flush list">${last.map(movRow).join("")}</div><span class="small faint">Desliza un movimiento a la izquierda para borrarlo o a la derecha para repetirlo.</span>` : `<div class="panel"><p class="muted" style="margin:0">Aquí verás tus compras e ingresos más recientes.</p></div>`;
    ult += `</div>`;

    // Productos del mes
    const prods = productStats(mk).slice(0, 5);
    let pr = "";
    if (prods.length) {
      pr = `<div class="sec"><div class="sec-h"><h2>En qué productos se va más</h2><button class="link" data-go="informes">Ver todos</button></div>
        <div class="panel flush list">${prods.map(p => `<button class="row" data-prod="${esc(p.k)}"><span class="dot" style="background:${cvar(catById(p.c).c)}"></span>
        <span style="min-width:0"><span class="t" style="display:block">${esc(p.n)}</span><span class="s" style="display:block">${esc(fmtN(p.q, 3))} ud. · último ${esc(fmt(p.lastP))}${p.lastStore ? " en " + esc(p.lastStore) : ""}</span></span>
        <span class="a">${esc(fmt(p.t))}</span></button>`).join("")}</div></div>`;
    }
    return h + `<div class="two-col"><div class="view">${bud}${fij}${deb}</div><div class="view">${ult}${pr}</div></div>`;
  },

  movs() {
    const mk = UI.mkMovs, t = totals(mk);
    const cal = Prefs.movView === "calendario";
    return `<div class="toolbar">${monthSwitch("mkMovs", mk)}<span class="small muted num">Gastos ${esc(fmt(t.gas))} · Ingresos ${esc(fmt(t.ing))}</span></div>
      <div class="seg" role="group" aria-label="Vista"><button type="button" data-mview="lista" aria-pressed="${!cal}">Lista</button><button type="button" data-mview="calendario" aria-pressed="${cal}">Calendario</button></div>
      <div class="toolbar"><input class="search" id="qMovs" type="search" enterkeyhint="search" placeholder="Buscar tienda, producto, categoría o #etiqueta" value="${esc(UI.q)}" aria-label="Buscar movimientos">
      <div class="chips" role="group" aria-label="Tipo">${[["todo", "Todo"], ["gasto", "Gastos"], ["ingreso", "Ingresos"], ["traspaso", "Traspasos"]].map(([k, n]) => `<button class="chip" data-ftipo="${k}" aria-pressed="${UI.fTipo === k}">${n}</button>`).join("")}</div></div>
      <div id="movsBody" style="display:flex;flex-direction:column;gap:14px">${movsBody()}</div>`;
  },

  informes() {
    const mk = UI.mkInf, t = totals(mk), sp = catSpend(mk);
    const rate = t.ing > 0 ? Math.round((t.bal / t.ing) * 100) : null;
    let h = `<div class="toolbar">${monthSwitch("mkInf", mk)}
      <button class="btn small" data-act="export">${ICON.dl}Exportar a Excel o PDF</button></div>
      <div class="stats">
        <div class="stat"><span class="label">Ingresos</span><span class="v good">${esc(fmt(t.ing))}</span></div>
        <div class="stat"><span class="label">Gastos</span><span class="v">${esc(fmt(t.gas))}</span></div>
        <div class="stat"><span class="label">Ahorro${rate != null ? ` · ${rate} %` : ""}</span><span class="v ${t.bal < 0 ? "bad" : "good"}">${esc(fmt(t.bal))}</span></div>
      </div>`;

    const rs = resumenMes(mk);
    if (rs.length) h += `<div class="sec"><h2>Lo más destacado</h2><div class="panel"><ul class="ins">${rs.map(r => `<li><span class="ic">${esc(r.ic)}</span><span>${esc(r.t)}</span></li>`).join("")}</ul></div></div>`;

    // Categorías
    const ids = new Set([...aj().cats.map(c => c.id), ...Object.keys(sp)]);
    const rows = [...ids].map(id => { const c = catById(id); return { c, g: sp[id] || 0, p: limite(c, mk) }; }).filter(r => r.g > 0 || r.p > 0).sort((a, b) => b.g - a.g);
    const max = Math.max(1, ...rows.map(r => Math.max(r.g, r.p)));
    let cats = `<div class="sec"><h2>Gasto por categoría</h2><div class="panel">`;
    cats += rows.length ? `<div class="cat-rows">${rows.map(r => `<div class="cat-row">
        <span class="nm"><span class="dot" style="background:${cvar(r.c.c)}"></span><span>${esc(r.c.n)}</span>${r.p && r.g > r.p ? `<span class="pill bad">+${esc(fmt(r.g - r.p))}</span>` : ""}</span>
        <span class="vv">${esc(fmt(r.g))}${r.p ? `<span class="muted"> / ${esc(fmt(r.p))}</span>` : ""}</span>
        <span class="track"><i style="width:${(r.g / max * 100).toFixed(1)}%;background:${cvar(r.c.c)}"></i>${r.p ? `<b style="left:calc(${(r.p / max * 100).toFixed(1)}% - 1px)" title="Presupuesto"></b>` : ""}</span>
      </div>`).join("")}</div><p class="small muted" style="margin:12px 0 0">La raya marca el presupuesto de cada categoría. En los gastos a medias solo cuenta tu parte.</p>` : `<p class="muted" style="margin:0">Sin gastos este mes.</p>`;
    cats += `</div></div>`;

    let evo = `<div class="sec"><h2>Últimos 6 meses</h2><div class="panel chart"><div id="chartEvo"></div>
      <div class="legend"><span><i style="background:var(--good)"></i>Ingresos</span><span><i style="background:var(--accent)"></i>Gastos</span></div></div></div>`;
    h += `<div class="two-col">${cats}${evo}</div>`;

    // Etiquetas
    const tmap = {};
    for (const m of monthMovs(mk)) if (m.tipo === "gasto") for (const tg of tagsOf(m)) tmap[tg] = r2((tmap[tg] || 0) + miParte(m));
    const tl = Object.entries(tmap).sort((a, b) => b[1] - a[1]);
    if (tl.length) h += `<div class="sec"><h2>Por etiqueta</h2><div class="panel flush list">${tl.map(([tg, v]) => `<button class="row" data-tagq="${esc(tg)}"><span class="tag">#</span><span class="t">${esc(tg)}</span><span class="a">${esc(fmt(v))}</span></button>`).join("")}</div>
      <p class="small muted" style="margin:0">Toca una etiqueta para ver todos sus gastos, de cualquier mes.</p></div>`;

    // Productos
    h += `<div class="sec"><div class="sec-h"><h2>Gasto por producto</h2></div>
      <input class="search" id="qProd" type="search" placeholder="Buscar producto" value="${esc(UI.qProd)}" aria-label="Buscar producto">
      <div class="panel flush" id="prodBody">${prodBody()}</div><p class="small muted" style="margin:0">Toca un producto para ver cómo ha cambiado su precio.</p></div>`;

    // Tiendas
    const st = storeStats(mk);
    if (st.length) {
      const tm = st[0].t;
      h += `<div class="sec"><h2>Dónde compras</h2><div class="panel"><div class="cat-rows">${st.slice(0, 8).map(s => `<div class="cat-row"><span class="nm"><span>${esc(s.n)}</span></span><span class="vv">${esc(fmt(s.t))}</span><span class="track"><i style="width:${(s.t / tm * 100).toFixed(1)}%;background:var(--accent)"></i></span></div>`).join("")}</div></div></div>`;
    }
    return h;
  },

  plan() {
    const d = D(), mk = curMk(), sp = catSpend(mk), sal = saldos();
    const avg = avgIncome(3);
    const totP = r2(aj().cats.reduce((a, c) => a + (+c.p || 0), 0));
    // Presupuestos

      <p class="small muted" style="margin:0 0 8px">${avg ? `Ingresos medios de los últimos 3 meses: <b class="num">${esc(fmt(avg))}</b>. ` : ""}Suma de tus límites: <b class="num">${esc(fmt(totP))}</b>. Deja vacío para no poner límite. Con «Acumular», lo que te sobre un mes se suma al siguiente (y lo que te pases, se resta).</p>

      <div class="btns"><button class="btn small primary" data-sugfijo="${esc(s.k)}">Sí, añadir</button><button class="btn small" data-nosug="${esc(s.k)}">No</button></div></div>`;

      <span class="a ${f.tipo === "ingreso" ? "in" : ""}">${f.tipo === "ingreso" ? "+" : ""}${esc(fmt(f.importe))}</span></button>`).join("")}</div>`
      : `<div class="panel"><p class="muted" style="margin:0 0 10px">Alquiler, móvil, suscripciones, gimnasio, la beca o la paga de casa… Apúntalos una vez y te recordaré cada mes cuándo tocan.</p><button class="btn small" data-act="addFijo">Añadir pago fijo</button></div>`;
    h += `</div>`;

    h += aj().favs.length ? `<div class="panel flush list">${aj().favs.map(f => `<button class="row" data-editfav="${esc(f.id)}"><span class="dot" style="background:${cvar(catById(f.cat).c)}"></span>
      <span style="min-width:0"><span class="t" style="display:block">${esc(f.n)}</span><span class="s" style="display:block">${esc(catById(f.cat).n)} · ${esc(metodoN(f.metodo))}${f.tienda && f.tienda !== f.n ? " · " + esc(f.tienda) : ""}</span></span><span class="a">${esc(fmt(f.importe))}</span></button>`).join("")}</div>`
      : `<div class="panel"><p class="muted" style="margin:0 0 10px">Lo que pagas a menudo (el café, el bus, el menú) se apunta con un solo toque desde el inicio.</p><button class="btn small" data-act="newFav">Crear favorito</button></div>`;

    h += d.metas.length ? d.metas.map(m => {
      const pct = m.objetivo > 0 ? Math.min(1, (+m.aportado || 0) / m.objetivo) : 0;

      let ritmo = "";
      if (m.limite && falta > 0) { const meses = Math.max(1, (new Date(m.limite + "T12:00").getFullYear() - new Date().getFullYear()) * 12 + new Date(m.limite + "T12:00").getMonth() - new Date().getMonth()); ritmo = ` · ${fmt(falta / meses)} al mes para llegar el ${dateShort(m.limite)}`; }

        <div class="bar"><i style="width:${(pct * 100).toFixed(1)}%;background:var(--good)"></i></div>

        <div class="btns"><button class="btn small" data-aportar="${esc(m.id)}">Apartar dinero</button><button class="btn small" data-meta="${esc(m.id)}">Editar</button></div></div>`;

    h += `</div></div>`;

    // Cuentas
    h += `<div class="sec"><div class="sec-h"><h2>Cuentas</h2><button class="link" data-act="addAcct">Añadir</button></div><div class="panel flush list">
      ${aj().cuentas.map(c => `<button class="row" data-acct="${esc(c.id)}"><span class="dot" style="background:var(--accent)"></span><span class="t">${esc(c.n)}</span><span style="display:flex;flex-direction:column;align-items:flex-end"><span class="a">${esc(fmt(sal[c.id] || 0))}</span><span class="small" style="color:var(--accent);font-weight:600">Ajustar saldo</span></span></button>`).join("")}
    </div><p class="small muted" style="margin:0">Si el saldo no coincide con tu banco o tu cartera, toca la cuenta y escribe la cifra real.</p></div>`;

    // Categorías
    h += `<div class="sec"><div class="sec-h"><h2>Categorías</h2><button class="link" data-act="addCat">Nueva</button></div><div class="panel"><div class="chips">
      ${aj().cats.map(c => `<button class="chip" data-cat="${esc(c.id)}"><span class="dot" style="background:${cvar(c.c)}"></span>${esc(c.n)}</button>`).join("")}
      ${aj().catsIng.map(c => `<button class="chip" data-cat="${esc(c.id)}"><span class="dot" style="background:${cvar(c.c)}"></span>${esc(c.n)} <span class="faint small">ingreso</span></button>`).join("")}
    </div></div></div>`;

    // Atajos y apariencia
    const badgeOk = "setAppBadge" in navigator && "Notification" in window;
    h += `<div class="sec"><h2>Siri, atajos y apariencia</h2><div class="panel flush list">
      <button class="row" data-act="siriCfg"><span class="dot" style="background:${Cfg.url ? "var(--good)" : "var(--line-2)"}"></span><span style="min-width:0"><span class="t" style="display:block">Apuntar con Siri</span><span class="s" style="display:block;white-space:normal">«Oye Siri, apunta un gasto» · ${Cfg.url ? "listo para configurar en Atajos" : "necesita tu hoja de Google conectada"}</span></span><span class="small" style="color:var(--accent);font-weight:600">Cómo</span></button>
      ${badgeOk ? `<button class="row" data-act="badgeCfg"><span class="dot" style="background:${Notification.permission === "granted" ? "var(--good)" : "var(--line-2)"}"></span><span style="min-width:0"><span class="t" style="display:block">Número en el icono</span><span class="s" style="display:block;white-space:normal">${Notification.permission === "granted" ? "Activado: muestra los pagos que vencen y lo que tienes por revisar" : "Muestra en el icono cuántos pagos vencen o tienes por revisar"}</span></span><span class="small" style="color:var(--accent);font-weight:600">${Notification.permission === "granted" ? "" : "Activar"}</span></button>` : ""}
      <button class="row" data-act="lookCfg"><span class="dot" style="background:var(--accent)"></span><span style="min-width:0"><span class="t" style="display:block">Apariencia</span><span class="s" style="display:block">${{ auto: "Según el sistema", light: "Clara", dark: "Oscura" }[Prefs.theme]} · color ${esc(ACCENTS[Prefs.accent]?.n || "azul")}</span></span><span class="small" style="color:var(--accent);font-weight:600">Cambiar</span></button>
    </div></div>`;

    // Datos
    const syncSub = !Cfg.url ? "Sin conectar: tus datos solo están en este dispositivo" : Sync.state === "error" ? Sync.err : `Conectada · última sincronización ${lastSyncText()}${OUT.length ? ` · ${OUT.length} cambios pendientes` : ""}`;
    h += `<div class="sec"><h2>Sincronización y datos</h2><div class="panel flush list">
      <button class="row" data-act="syncCfg"><span class="dot" style="background:${!Cfg.url ? "var(--warn)" : Sync.state === "error" ? "var(--bad)" : "var(--good)"}"></span><span style="min-width:0"><span class="t" style="display:block">Hoja de Google</span><span class="s" style="display:block;white-space:normal">${esc(syncSub)}</span></span><span class="small" style="color:var(--accent);font-weight:600">${Cfg.url ? "Ajustes" : "Conectar"}</span></button>
      <button class="row" data-act="gemCfg"><span class="dot" style="background:${Cfg.gemini ? "var(--good)" : "var(--line-2)"}"></span><span style="min-width:0"><span class="t" style="display:block">Leer tickets con Gemini</span><span class="s" style="display:block;white-space:normal">${Cfg.gemini ? "Activado en este dispositivo" : "Sin activar: necesitas una clave gratuita de Google"}</span></span><span class="small" style="color:var(--accent);font-weight:600">${Cfg.gemini ? "Ajustes" : "Activar"}</span></button>
      <button class="row" data-act="importBank"><span class="dot" style="background:var(--c5)"></span><span style="min-width:0"><span class="t" style="display:block">Importar del banco</span><span class="s" style="display:block;white-space:normal">Sube el Excel o CSV de movimientos que descargas de tu banco. Se saltan los que ya tengas.</span></span><span class="small" style="color:var(--accent);font-weight:600">Importar</span></button>
    </div>
    <div class="btns"><button class="btn small" data-act="backup">${ICON.dl}Copia de seguridad (.json)</button><button class="btn small" data-act="restore">Restaurar una copia</button>${demoOn ? "" : `<button class="btn small" data-act="demoStart">Ver datos de ejemplo</button>`}</div></div>`;
    return h + `</div></div>`;
  }
};

/* ---------- Movimientos: lista, búsqueda y calendario ---------- */
function matchQ(m, q) {
  if (q.startsWith("#")) { const t = q.slice(1); return tagsOf(m).some(x => norm(x).startsWith(t)); }
  return norm([m.tienda, m.concepto, m.texto, catById(m.cat).n, metodoN(m.metodo), ...(m.items || []).map(i => i.n), ...tagsOf(m).map(t => "#" + t), ...reparto(m).map(r => r.p)].join(" ")).includes(q);
}
function movsBody() {
  const mk = UI.mkMovs, q = norm(UI.q);
  const all = !!q && UI.qAll;
  let list = all ? D().movs : monthMovs(mk);
  if (UI.fTipo !== "todo") list = list.filter(m => m.tipo === UI.fTipo);
  if (q) list = list.filter(m => matchQ(m, q));
  let h = "";
  if (q) {
    const g = r2(list.filter(m => m.tipo === "gasto").reduce((a, m) => a + miParte(m), 0));
    h += `<div class="chips"><button class="chip" data-qall="0" aria-pressed="${!all}">Solo ${esc(monthLabel(mk))}</button><button class="chip" data-qall="1" aria-pressed="${all}">Todos los meses</button>
      ${list.length ? `<span class="small muted" style="align-self:center">${plural(list.length, "resultado", "resultados")}${g ? ` · ${esc(fmt(g))} en gastos` : ""}</span>` : ""}</div>`;
  }
  if (Prefs.movView === "calendario" && !all) {
    h += calHtml(mk, list);
    if (!(UI.day && UI.day.startsWith(mk))) return h + `<p class="small muted" style="margin:0">Toca un día para ver sus movimientos. Cuanto más oscuro, más gastaste.</p>`;
    list = list.filter(m => m.fecha === UI.day);
    if (!list.length) return h + `<div class="empty"><p>El ${esc(dayLabel(UI.day))} no apuntaste nada.</p><button class="btn small" data-act="quickDay">${ICON.plus}Apuntar algo ese día</button></div>`;
  }
  if (!list.length) {
    const filt = q || UI.fTipo !== "todo";
    return h + `<div class="empty"><p>${filt ? `No hay movimientos que coincidan${all ? "" : " en este mes"}.${q && !all ? " Prueba con «Todos los meses»." : ""}` : `No hay movimientos en ${esc(monthLabel(mk))}.`}</p>${filt ? "" : `<button class="btn primary" data-act="quick">${ICON.plus}Añadir gasto</button>`}</div>`;
  }
  const byDay = {};
  for (const m of list) (byDay[m.fecha] ||= []).push(m);
  const yr = todayStr().slice(0, 4);
  h += `<div>`;
  for (const day of Object.keys(byDay).sort().reverse()) {
    const ms = byDay[day];
    const g = r2(ms.filter(m => m.tipo === "gasto").reduce((a, m) => a + miParte(m), 0));
    h += `<div class="day-h"><span>${esc(dayLabel(day))}${day.slice(0, 4) !== yr ? " " + day.slice(0, 4) : ""}</span>${g ? `<span class="num">−${esc(fmt(g))}</span>` : ""}</div><div class="panel flush list">${ms.map(movRow).join("")}</div>`;
  }
  return h + `</div>`;
}
function calHtml(mk, list) {
  const days = daysIn(mk), offset = (new Date(mk + "-01T12:00").getDay() + 6) % 7;   // la semana empieza en lunes
  const per = {};
  for (const m of list) if (m.tipo === "gasto") per[m.fecha] = (per[m.fecha] || 0) + miParte(m);
  const vals = Object.values(per).filter(v => v > 0).sort((a, b) => a - b);
  const qt = p => vals.length ? vals[Math.min(vals.length - 1, Math.floor(p * vals.length))] : 0;
  const t1 = qt(0.25), t2 = qt(0.5), t3 = qt(0.8);
  const lvl = v => !(v > 0) ? 0 : v <= t1 ? 1 : v <= t2 ? 2 : v <= t3 ? 3 : 4;
  const today = todayStr();
  let zero = 0, h = `<div class="panel"><div class="cal" role="grid" aria-label="Gasto por día de ${esc(monthLabel(mk))}">${["L", "M", "X", "J", "V", "S", "D"].map(d => `<span class="wd">${d}</span>`).join("")}`;
  for (let i = 0; i < offset; i++) h += `<span class="cal-d empty"></span>`;
  for (let d = 1; d <= days; d++) {
    const ds = `${mk}-${pad(d)}`, v = r2(per[ds] || 0), fut = ds > today;
    if (!fut && !(v > 0)) zero++;
    const cls = ["cal-d", "l" + lvl(v), fut ? "fut" : "", !fut && !(v > 0) ? "zero" : "", ds === today ? "today" : ""].filter(Boolean).join(" ");
    h += `<button type="button" class="${cls}" data-day="${ds}" aria-pressed="${UI.day === ds}" aria-label="${esc(dayLabel(ds))}: ${v > 0 ? esc(fmt(v)) : "sin gastos"}"><span class="n">${d}</span><span class="v">${fut ? "" : v > 0 ? esc(fmtN(v, v >= 10 ? 0 : 1)) : "0"}</span></button>`;
  }
  const sw = p => `<i style="background:color-mix(in srgb,var(--accent) ${p}%,var(--surface))"></i>`;
  return h + `</div><div class="cal-leg" style="margin-top:10px"><span>Menos</span>${sw(12)}${sw(28)}${sw(48)}${sw(72)}<span>Más</span><span style="margin-left:auto;color:var(--good);font-weight:600">${zero} ${zero === 1 ? "día" : "días"} sin gastar</span></div></div>`;
}

function prodBody() {
  const qp = norm(UI.qProd);
  const prods = productStats(UI.mkInf).filter(p => !qp || p.k.includes(qp));
  return prods.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Producto</th><th class="r">Unid.</th><th class="r">Gasto</th><th class="r">Precio medio</th></tr></thead><tbody>
      ${prods.map(p => `<tr data-prod="${esc(p.k)}"><td><span style="display:inline-flex;align-items:center;gap:8px"><span class="dot" style="background:${cvar(catById(p.c).c)}"></span>${esc(p.n)}</span></td><td class="r">${esc(fmtN(p.q, 3))}</td><td class="r">${esc(fmt(p.t))}</td><td class="r">${esc(fmt(p.avg))}</td></tr>`).join("")}
      </tbody></table></div>` : `<p class="muted" style="margin:0;padding:14px 16px">${qp ? "Ningún producto coincide." : "Cuando apuntes compras producto a producto, aquí verás cuánto gastas en cada uno."}</p>`;
}

/* =========================================================
   Hoja inferior (diálogos)
   ========================================================= */
const Sheet = { onClick: null, onInput: null, onChange: null, lastFocus: null };
function openSheet(title, body, foot, handlers = {}) {
  const wasOpen = !$("#sheet").hidden;
  if (!wasOpen) Sheet.lastFocus = document.activeElement;
  $("#sheetTitle").textContent = title;
  $("#sheetBody").innerHTML = body;
  $("#sheetFoot").innerHTML = foot || "";
  $("#sheetFoot").hidden = !foot;
  Object.assign(Sheet, { onClick: null, onInput: null, onChange: null }, handlers);
  $("#sheet").hidden = false;
  document.body.style.overflow = "hidden";
  if (!wasOpen) { $("#sheetBody").scrollTop = 0; setTimeout(() => { const f = $("#sheet [data-autofocus]"); if (f && window.matchMedia("(min-width:700px)").matches) f.focus(); }, 60); }
}
function closeSheet() {
  if (readCtl) { readCtl.abort(); readCtl = null; }
  $("#sheet").hidden = true; document.body.style.overflow = "";
  F = null; Sheet.onClick = Sheet.onInput = Sheet.onChange = null;
  try { Sheet.lastFocus?.focus?.(); } catch (e) {}
}
let toastTimer = null;
function toast(msg, action, ms = 3800) {
  const el = $("#toast");
  el.innerHTML = `<span>${esc(msg)}</span>${action ? `<button>${esc(action.label)}</button>` : ""}`;
  if (action) el.querySelector("button").onclick = () => { el.hidden = true; action.fn(); };
  el.hidden = false; clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, action ? Math.max(ms, 6000) : ms);
}
// Botón de borrar con confirmación en dos toques
function armDelete(btn, fn) {
  if (btn.classList.contains("armed")) { fn(); return; }
  btn.classList.add("armed"); const old = btn.textContent; btn.textContent = "Toca otra vez para borrar";
  setTimeout(() => { if (btn.isConnected) { btn.classList.remove("armed"); btn.textContent = old; } }, 4000);
}
const chipsHtml = (attr, items, sel) => `<div class="chips" role="group">${items.map(it => `<button type="button" class="chip" data-${attr}="${esc(it.id)}" aria-pressed="${it.id === sel}">${it.c != null ? `<span class="dot" style="background:${cvar(it.c)}"></span>` : ""}${esc(it.n)}</button>`).join("")}</div>`;
const pressChip = (attr, val) => $$(`#sheet [data-${attr}]`).forEach(b => b.setAttribute("aria-pressed", b.dataset[attr.replace(/-./g, s => s[1].toUpperCase())] === val));

/* ---------- Detalle de un movimiento ---------- */
function ticketHtml(m) {
  const items = m.items || [];
  return `<div class="ticket">
    <div class="tc store">${esc(m.tienda || catById(m.cat).n)}</div>
    <div class="tc q muted small">${esc(cap(dayLabel(m.fecha)))}</div><hr>

function guessCat(text, tipo = "gasto") {
  const t = norm(text); if (!t) return null;
  const list = tipo === "ingreso" ? aj().catsIng : aj().cats, ok = id => list.some(c => c.id === id);
  // 1) Una tienda o concepto que ya usaste: la categoría de la última vez
  const prev = D().movs.find(m => m.tipo === tipo && norm(m.tienda || m.concepto) === t && ok(m.cat));
  if (prev) return prev.cat;
  const words = t.split(/[^a-z0-9ñ]+/).filter(Boolean);
  // 2) Palabras típicas («café», «Mercadona», «bus»…)
  const dict = tipo === "ingreso" ? KW_ING : KW;
  for (const [id, kws] of Object.entries(dict)) { if (!ok(id)) continue; const set = kws.split(" "); if (words.some(w => set.includes(w) || (w.length > 3 && set.includes(w.replace(/e?s$/, ""))))) return id; }

  for (const c of list) { const cn = norm(c.n); if (words.some(w => w.length > 3 && cn.startsWith(w))) return c.id; }

  const st = knownStores().find(s => norm(s.n).length > 2 && t.includes(norm(s.n)) && ok(s.cat));
  return st ? st.cat : null;
}
const NUMW = { un: 1, uno: 1, una: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, veintiuno: 21, veintidos: 22, veintitres: 23, veinticuatro: 24, veinticinco: 25, veintiseis: 26, veintisiete: 27, veintiocho: 28, veintinueve: 29, treinta: 30, cuarenta: 40, cincuenta: 50, sesenta: 60, setenta: 70, ochenta: 80, noventa: 90, cien: 100, ciento: 100, doscientos: 200, trescientos: 300, cuatrocientos: 400, quinientos: 500, mil: 1000 };
// Convierte «cinco con cuarenta», «doce euros» o «treinta y cinco» en cifras
function wordsToDigits(t) {
  return t.replace(/\b((?:un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|dieci\w+|veinte|veinti\w+|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa|cien|ciento|doscientos|trescientos|cuatrocientos|quinientos|mil)(?:\s+(?:y\s+)?(?:un|uno|una|dos|tres|cuatro|cinco|seis|siete|ocho|nueve|diez|once|doce|trece|catorce|quince|dieci\w+|veinte|veinti\w+|treinta|cuarenta|cincuenta|sesenta|setenta|ochenta|noventa|cien|ciento|doscientos|trescientos|cuatrocientos|quinientos|mil))*)\b/g, m => {
    let total = 0, cur = 0, afterY = false;
    const ws = m.split(/\s+/);
    for (let i = 0; i < ws.length; i++) {
      const w = ws[i]; if (w === "y") { afterY = true; continue; }
      const v = NUMW[w]; if (v == null) return m;
      // «cinco cuarenta», «doce cincuenta»: euros y céntimos dichos seguidos
      if (cur > 0 && cur < 100 && v < 100 && !afterY && !total && v >= 10) return `${cur},${pad(v)}` + (ws.slice(i + 1).length ? " " + ws.slice(i + 1).join(" ") : "");
      if (v === 1000) { total += (cur || 1) * 1000; cur = 0; } else cur += v;
      afterY = false;
    }
    return String(total + cur);
  });
}
function parseRapido(txt, base = {}) {
  const orig = String(txt || "").trim();
  let t = " " + norm(orig).replace(/[¿?¡!"]/g, " ") + " ";
  const r = { tipo: "gasto", importe: 0, fecha: base.fecha || todayStr(), metodo: null, tags: [], reparto: [], label: "", cat: null };
  // Etiquetas (#viaje) antes de normalizar más
  r.tags = parseTags((orig.match(/#[\p{L}\d_-]+/gu) || []).join(" "));
  t = t.replace(/#[a-z0-9ñ_-]+/g, " ");
  if (/\b(cobrad[oa]|he cobrado|ingreso|ingresado|me han (pagado|dado|ingresado|hecho un bizum)|recibido|me ha llegado|nomina|beca)\b/.test(t)) r.tipo = "ingreso";
  if (/\b(anteayer|antes de ayer)\b/.test(t)) { r.fecha = addDays(todayStr(), -2); t = t.replace(/\b(anteayer|antes de ayer)\b/g, " "); }
  else if (/\bayer\b/.test(t)) { r.fecha = addDays(todayStr(), -1); t = t.replace(/\bayer\b/g, " "); }
  t = t.replace(/\b(hoy|esta (manana|tarde|noche)|ahora|ahora mismo)\b/g, " ");
  if (/\b(en |con |pague en |pagado en )?(efectivo|metalico|cash|suelto)\b/.test(t)) { r.metodo = "efectivo"; t = t.replace(/\b(en |con |pague en |pagado en )?(efectivo|metalico|cash)\b/g, " "); }
  else if (/\b(con |por |un )?bizum\b/.test(t) && r.tipo === "gasto") { r.metodo = "bizum"; t = t.replace(/\b(con |por |un )?bizum\b/g, " "); }
  else if (/\bcon (la )?tarjeta\b/.test(t)) { r.metodo = "tarjeta"; t = t.replace(/\bcon (la )?tarjeta\b/g, " "); }
  // A medias con alguien: «a medias con Lucía», «entre Ana y yo»
  const medias = t.match(/\b(?:a medias|a pachas|dividido|entre los dos) con ([a-zñ]+)(?: y ([a-zñ]+))?/) || t.match(/\bentre ([a-zñ]+) y yo\b/);
  if (medias) {
    // Nombre con sus tildes y mayúsculas tal como lo dijiste («Lucía»)
    const origW = orig.split(/\s+/).map(w => w.replace(/[.,;:!?¿¡]+$/, ""));
    r.medias = [medias[1], medias[2]].filter(Boolean).map(n => cap(origW.find(w => norm(w) === n) || n));
    t = t.replace(medias[0], " ");
  }
  t = wordsToDigits(t);
  // Importe: «5,40», «5.40 €», «5 euros con 40», «5 con 40», «1.250,00»
  const NUM = "(\\d{1,3}(?:\\.\\d{3})+(?:,\\d{1,2})?|\\d+(?:[.,]\\d{1,2})?)", CENT = "(?:\\s*(?:con|y)\\s*(\\d{1,2})(?:\\s*(?:centimos|cents?|ctms?))?)?";
  // Primero un número pegado a «€/euros»; si no hay, el primero que aparezca
  const am = t.match(new RegExp(NUM + "\\s*(?:€|eur\\b|euros?\\b|pavos\\b)" + CENT)) || t.match(new RegExp(NUM + CENT));
  if (am) {
    let v = parseNum(am[1]);
    if (am[2] != null && !/[.,]/.test(am[1])) v += +am[2] / (am[2].length === 1 ? 10 : 100);
    if (v > 0) r.importe = r2(v);
    t = t.replace(am[0], " ");
  }
  if (r.medias && r.importe > 0) { const each = Math.floor(r.importe / (r.medias.length + 1) * 100) / 100; r.reparto = r.medias.map(p => ({ p, i: each })); }
  // Lo que queda es el concepto: quita muletillas y preposiciones sueltas
  t = t.replace(/\b(acabo de gastar(me)?|me he gastado|he gastado|gaste|me gaste|gastado|gasto|gastar|apunta(me)?|anota(me)?|pon(me)?|he pagado|pague|pagado|paga|he cobrado|cobrado|me han pagado|me han dado|me han ingresado|ingreso de|ingreso|un gasto de|euros?|€|eur|pavos|centimos)\b/g, " ");
  t = t.replace(/\s+/g, " ").trim().replace(/^(en|de|del|por|para|el|la|los|las|un|una|y|con|al)\s+/g, "").replace(/^(el|la|los|las|un|una)\s+/, "").replace(/\s+(en|de|del|por|para|y|con|el|la)$/g, "").trim();
  // Recupera mayúsculas y tildes del texto original para el nombre
  if (t) {
    const words = orig.split(/\s+/), nw = words.map(w => wordsToDigits(norm(w)).replace(/[^a-z0-9ñ]/g, ""));
    const first = t.split(" ")[0], last = t.split(" ").pop();
    const i = nw.indexOf(first), j = nw.lastIndexOf(last);

  }

  return r;
}

let procesando = false;
async function procesarRapidos() {
  if (procesando || demoOn || !backend) return;
  const pend = Real.movs.filter(m => m.rapido && !m.procesado);
  if (!pend.length) return;
  procesando = true;
  try {
    const ops = pend.map(m => {
      const p = parseRapido(m.texto || "", { fecha: validDate(m.fecha) ? m.fecha : todayStr() });
      if (validDate(m.fecha) && p.fecha === todayStr()) p.fecha = m.fecha;
      const base = { creado: m.creado || Date.now(), rapido: true, procesado: true, texto: m.texto || "", origen: m.origen || "siri" };
      if (!(p.importe > 0)) return { col: "movs", id: m.id, data: { ...stripId(m), ...base, tipo: "gasto", importe: 0, cat: m.cat || (aj().cats.find(c => c.id === "otros") || aj().cats[0]).id, cuenta: m.cuenta || aj().cuentas[0].id, fecha: p.fecha, revisar: true } };
      const d = rapidoData(p, base);
      if (!p.cat) d.revisar = true;   // no he sabido la categoría: que lo revise
      return { col: "movs", id: m.id, data: d };
    });
    await backend.many(ops);
